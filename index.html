<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Roshan Bundle Activation</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101826">
<meta name="app-build-version" content="0.4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="روشن پورټال">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6675;
    --sidebar:#101826;
    --sidebar-text:#C9D1DB;
    --sidebar-text-dim:#7C8698;
    --accent:#B8862B;
    --accent-soft:#F3E7CE;
    --ok:#2E7D5B;
    --ok-soft:#DFF0E7;
    --danger:#B3432B;
    --danger-soft:#F6E1DA;
    --info:#2E5FA3;
    --info-soft:#DDE8F6;
    --border:#DDE2E8;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:contain;}
  body{
    font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    color:var(--ink);
    direction:rtl;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  button,.btn,.nav-item,.icon-btn,.icon-btn-sm,.icon-btn-copy,input,select,textarea{touch-action:manipulation;}
  #app{min-height:100vh;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 85% 10%, rgba(184,134,43,0.18), transparent 45%),
      linear-gradient(180deg, #101826 0%, #182234 100%);
  }
  .login-card{
    background:var(--surface);
    width:100%;
    max-width:380px;
    border-radius:16px;
    padding:36px 30px;
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
  }
  .login-brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .login-brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,#B8862B,#8f6a20);
    flex:none;
  }
  .login-brand span{font-weight:800;font-size:19px;letter-spacing:.2px;}
  .login-card p.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 26px 0;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input, .field textarea, .field select{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--border);
    border-radius:8px;
    font-family:inherit;
    font-size:14.5px;
    background:#FBFCFD;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .field input:disabled, .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 18px;
    border-radius:8px;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:filter .15s, transform .05s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-gold{background:var(--accent);color:#fff;}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-ok:hover{filter:brightness(1.1);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{filter:brightness(1.1);}
  .btn-info{background:var(--info);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:6px;}
  .icon-btn{
    width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);
    background:#fff;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;
  }
  .icon-btn:hover{border-color:var(--accent);}
  .icon-btn-sm{
    width:28px;height:28px;border-radius:7px;border:1.5px solid var(--border);
    background:#fff;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:14px;color:var(--danger);
  }
  .icon-btn-sm:hover{border-color:var(--danger);background:var(--danger-soft);}
  .icon-btn-copy{
    border:none;background:transparent;cursor:pointer;font-size:13px;
    color:var(--ink-soft);padding:2px 4px;vertical-align:middle;
  }
  .icon-btn-copy:hover{color:var(--accent);}
  .error-box{
    background:var(--danger-soft);color:var(--danger);
    border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:16px;font-weight:600;
  }

  /* ---------- Disabled full screen ---------- */
  .blocked-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:#101826;
  }
  .blocked-card{
    background:#fff;border-radius:16px;padding:40px 32px;max-width:420px;text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,.35);
  }
  .blocked-card .icon{
    width:56px;height:56px;border-radius:50%;background:var(--danger-soft);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px auto;
    font-size:26px;color:var(--danger);
  }
  .blocked-card h3{margin:0 0 10px 0;font-size:17px;}
  .blocked-card p{color:var(--ink-soft);font-size:14px;line-height:1.8;direction:ltr;text-align:center;}

  /* ---------- Dashboard layout ---------- */
  /* Sidebar is an overlay drawer on ALL screen sizes: hidden by default,
     opened/closed via the hamburger icon in the top bar. */
  .shell{position:relative;}
  .sidebar-backdrop{
    position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:54;
    display:none;
  }
  .sidebar-backdrop.show{display:block;}
  body.force-desktop .sidebar-backdrop{display:none !important;}
  .sidebar{
    width:236px;background:var(--sidebar);color:var(--sidebar-text);
    display:none;
    flex-direction:column;padding:22px 16px;
    position:fixed;top:0;right:0;height:100vh;z-index:55;
    box-shadow:0 12px 24px rgba(0,0,0,.3);
    overflow-y:auto;
  }
  .sidebar.mobile-open{display:flex;}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px 6px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:18px;}
  .sidebar .brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#B8862B,#8f6a20);flex:none;}
  .sidebar .brand b{font-size:15.5px;}
  .sidebar .role-tag{
    font-size:11.5px;color:var(--sidebar-text-dim);
    background:rgba(255,255,255,.06);
    display:inline-block;padding:3px 10px;border-radius:20px;margin-bottom:18px;
  }
  .nav-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 12px;border-radius:8px;margin-bottom:4px;
    color:var(--sidebar-text);cursor:pointer;font-size:14px;font-weight:600;
    transition:background .12s;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--accent);color:#fff;}
  .nav-badge{
    background:var(--danger);color:#fff;font-size:11px;font-weight:800;
    min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;
  }
  .sidebar .spacer{flex:1;}
  .sidebar .user-box{
    border-top:1px solid rgba(255,255,255,.08);padding-top:14px;margin-top:8px;
  }
  .sidebar .user-box .uname{font-size:13.5px;font-weight:700;color:#fff;margin-bottom:8px;}
  .main{padding:30px 34px;overflow-y:auto;min-width:0;}
  .main-header{margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .main-header h2{margin:0 0 4px 0;font-size:21px;}
  .main-header p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .header-actions{display:flex;gap:8px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
  .card h4{margin:0 0 16px 0;font-size:15px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .row .field{flex:1;min-width:180px;margin-bottom:0;}

  /* ---------- Search box ---------- */
  .search-row{margin-bottom:16px;position:relative;}
  .search-row input{
    width:100%;padding:11px 40px 11px 13px;border:1.5px solid var(--border);border-radius:8px;
    font-family:inherit;font-size:14px;background:#FBFCFD;color:var(--ink);outline:none;
    transition:border-color .15s;
  }
  .search-row input:focus{border-color:var(--accent);}
  .search-row .search-icon{
    position:absolute;top:50%;right:13px;transform:translateY(-50%);
    color:var(--ink-soft);font-size:14px;pointer-events:none;
  }

  /* ---------- Pagination bar ---------- */
  .pager{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
  }
  .pager .pager-info{font-size:12.5px;color:var(--ink-soft);}
  .pager .pager-nav{display:flex;align-items:center;gap:6px;}
  .pager .pager-nav button{
    width:32px;height:32px;border-radius:7px;border:1.5px solid var(--border);background:#fff;
    cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .pager .pager-nav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .pager .pager-nav button:disabled{opacity:.4;cursor:not-allowed;}
  .pager .pager-nav .pager-page{font-size:12.5px;color:var(--ink-soft);padding:0 4px;min-width:70px;text-align:center;}

  table{width:100%;border-collapse:collapse;font-size:13.4px;}
  th,td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--border);}
  th{color:var(--ink-soft);font-weight:700;font-size:12px;}
  tr:last-child td{border-bottom:none;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;
    cursor:default;
  }
  .badge.clickable{cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .badge-pending{background:var(--accent-soft);color:#7a5a17;}
  .badge-process{background:var(--info-soft);color:var(--info);}
  .badge-approved{background:var(--ok-soft);color:var(--ok);}
  .badge-rejected{background:var(--danger-soft);color:var(--danger);}
  .badge-resubmit{background:#EFE3F7;color:#6b3fa0;}
  .badge-deactivated{background:#E7E4E0;color:#5C5347;}
  .badge-enabled{background:var(--ok-soft);color:var(--ok);}
  .badge-disabled{background:var(--danger-soft);color:var(--danger);}
  .empty-state{color:var(--ink-soft);font-size:13.5px;padding:26px 10px;text-align:center;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 22px;border-radius:9px;font-size:13.5px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:999;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .note-text{color:var(--ink-soft);font-size:12.5px;margin:14px 0 0 0;}
  .small-muted{color:var(--ink-soft);font-size:11.5px;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(16,24,38,.55);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:500;
  }
  .modal-card{
    background:#fff;border-radius:14px;padding:26px;max-width:460px;width:100%;
    box-shadow:0 30px 60px rgba(0,0,0,.35);
  }
  .modal-card h3{margin:0 0 14px 0;font-size:16.5px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .modal-close{
    position:absolute;top:14px;left:14px;
  }
  .modal-card{position:relative;}
  .proc-number-box{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:16px;}
  .proc-number-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .proc-number{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:.3px;}
  .proc-bundle-name{font-size:13px;color:var(--ink-soft);margin-top:6px;}

  /* ---------- Top bar with hamburger toggle (shown on every screen size) ---------- */
  .mobile-topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--sidebar);color:#fff;padding:12px 16px;
    position:sticky;top:0;z-index:60;
  }
  .mobile-topbar .mt-title{font-weight:800;font-size:15px;color:#fff;}
  .mobile-topbar .hamburger-btn{
    background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#fff;
    width:38px;height:38px;border-radius:8px;font-size:18px;cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .mobile-topbar .hamburger-btn:hover{border-color:var(--accent);}
  .mobile-topbar .mt-spacer{width:38px;flex:none;}

  /* ---------- Top-bar user menu ---------- */
  .mt-user-wrap{position:relative;flex:none;}
  .mt-user-btn{
    background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#fff;
    padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;font-family:inherit;max-width:150px;
  }
  .mt-user-btn:hover{border-color:var(--accent);}
  .mt-user-btn .mt-user-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:105px;}
  .mt-user-btn .mt-caret{font-size:10px;color:var(--sidebar-text-dim);flex:none;}
  .mt-user-dropdown{
    position:absolute;top:calc(100% + 8px);left:0;
    background:#fff;color:var(--ink);border-radius:10px;min-width:200px;
    box-shadow:0 14px 34px rgba(0,0,0,.28);padding:8px;z-index:70;
    display:flex;flex-direction:column;gap:2px;
  }
  .mt-user-item{
    background:transparent;border:none;text-align:right;padding:10px 12px;border-radius:7px;
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .mt-user-item:hover{background:var(--bg);}
  .mt-user-item-danger{color:var(--danger);}
  .mt-user-item-danger:hover{background:var(--danger-soft);}

  /* ---------- Desktop view toggle (forces a permanently-visible wide layout, e.g. on phones) ---------- */
  body.force-desktop .sidebar{
    display:flex !important;
    position:static !important;
    width:236px !important;flex:none !important;flex-direction:column !important;flex-wrap:nowrap !important;
    padding:22px 16px !important;align-items:stretch !important;
    box-shadow:none !important;
  }
  body.force-desktop .shell{display:flex !important;flex-direction:row !important;}
  body.force-desktop .sidebar .brand{display:flex !important;border-bottom:1px solid rgba(255,255,255,.08) !important;margin-bottom:18px !important;padding:0 6px 22px 6px !important;width:auto !important;}
  body.force-desktop .sidebar .role-tag{margin-bottom:18px !important;}
  body.force-desktop .sidebar .spacer{display:block !important;}
  body.force-desktop .sidebar .user-box{border-top:1px solid rgba(255,255,255,.08) !important;padding-top:14px !important;margin-top:8px !important;margin-right:0 !important;}
  body.force-desktop .nav-item{margin-bottom:4px !important;}
  body.force-desktop .main{padding:30px 34px !important;}
  body.force-desktop table{font-size:13.4px !important;}
  body.force-desktop .row{flex-direction:row !important;}
  body.force-desktop .row .field, body.force-desktop .row .btn{width:auto !important;}
  body.force-desktop{min-width:900px;}

  @media (max-width:860px){
    .sidebar{width:100%;left:0;right:0;padding:16px;}
    .main{padding:14px 12px;}
    .grid-2{grid-template-columns:1fr;}
    .card{padding:16px;border-radius:12px;}
    .row{flex-direction:column;align-items:stretch;}
    .row .field{width:100%;min-width:0;}
    .row .btn{width:100%;padding:13px 18px;}
    .pager{flex-direction:column;align-items:stretch;}
    .pager .pager-nav{justify-content:center;}
    .pager .pager-nav button{width:38px;height:38px;}
    .field input, .field textarea, .field select, .search-row input{font-size:16px;padding:12px 14px;}
    .icon-btn{width:40px;height:40px;font-size:18px;}
    .icon-btn-sm{width:34px;height:34px;font-size:16px;}
    .btn-sm{padding:9px 14px;font-size:13.5px;}
    .nav-item{padding:13px 12px;font-size:15px;}

    /* Tables become stacked cards on phones -- no horizontal scrolling. */
    table{font-size:13.5px;}
    table thead{display:none;}
    table, table tbody, table tr{display:block;width:100%;}
    table tr{
      background:var(--surface);border:1px solid var(--border);border-radius:12px;
      margin-bottom:12px;padding:4px 14px;
    }
    table td{
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding:11px 0;border-bottom:1px solid var(--border);
      text-align:left;
    }
    table td:last-child{border-bottom:none;}
    table td:empty{display:none;}
    table td:before{
      content:attr(data-label);
      font-weight:700;color:var(--ink-soft);font-size:11.5px;flex:none;
    }
    table td:not([data-label]):before, table td[data-label=""]:before{content:none;}
  }
</style>
</head>

  var PAGE_SIZE = 20;

  // ---------------- generic pagination helper ----------------
  // Renders a "1-20 of 78" style pager with prev/next icons into containerEl.
  // page: 0-based current page. total: total item count. onChange(newPage) is called on nav.
  function renderPager(containerEl, page, total, onChange){
    if(!containerEl) return;
    if(total<=PAGE_SIZE){ containerEl.innerHTML=''; return; }
    var pageCount = Math.ceil(total/PAGE_SIZE);
    if(page>pageCount-1) page = pageCount-1;
    var startN = total===0 ? 0 : (page*PAGE_SIZE)+1;
    var endN = Math.min(total, (page+1)*PAGE_SIZE);
    containerEl.innerHTML =
      '<div class="pager">'+
        '<div class="pager-info">'+startN+'-'+endN+' / '+total+'</div>'+
        '<div class="pager-nav">'+
          '<button data-pg="first" '+(page<=0?'disabled':'')+' title="لومړی">&#171;</button>'+
          '<button data-pg="prev" '+(page<=0?'disabled':'')+' title="مخکینی">&#8250;</button>'+
          '<span class="pager-page">'+(page+1)+' / '+pageCount+'</span>'+
          '<button data-pg="next" '+(page>=pageCount-1?'disabled':'')+' title="راتلونکی">&#8249;</button>'+
          '<button data-pg="last" '+(page>=pageCount-1?'disabled':'')+' title="وروستی">&#187;</button>'+
        '</div>'+
      '</div>';
    Array.prototype.forEach.call(containerEl.querySelectorAll('[data-pg]'), function(btn){
      btn.onclick = function(){
        var which = btn.getAttribute('data-pg');
        var np = page;
        if(which==='first') np = 0;
        else if(which==='prev') np = Math.max(0, page-1);
        else if(which==='next') np = Math.min(pageCount-1, page+1);
        else if(which==='last') np = pageCount-1;
        onChange(np);
      };
    });
  }

  // Filters a list of objects by a search string across the given field names (case-insensitive).
  function filterBySearch(list, query, fields){
    var q = (query||'').trim().toLowerCase();
    if(!q) return list;
    return list.filter(function(item){
      return fields.some(function(f){
        var v = item[f];
        return v!=null && String(v).toLowerCase().indexOf(q)!==-1;
      });
    });
  }

  // Binds a search input so typing filters+re-renders without losing focus/cursor position.
  function bindSearchInput(inputId, getQuery, setQuery, rerenderFn){
    var el = document.getElementById(inputId);

    el.oninput = function(){

  // ---------------- storage helpers (Firestore) ----------------
  // sGetDoc reports whether the read actually succeeded (ok:true/false),
  // separately from whether the document simply has no data yet.
  // This distinction matters: a failed read (offline, network blip, etc.)
  // must NEVER be treated the same as "no data exists" -- doing so is what
  // caused ensureSeed() to wipe out every manager/NTO account whenever a
  // Firestore read hiccuped (see ensureSeed below).
  function sGetDoc(name){
    return db.collection('appdata').doc(name).get().then(function(snap){
      return {ok:true, list:(snap.exists && snap.data().list) ? snap.data().list : null};
    }).catch(function(err){
      return {ok:false, list:null, err:err};
    });
  }
  function sSetDoc(name, list){
    return db.collection('appdata').doc(name).set({list:list});
  }
  function loadJSON(key, fallback){
    return sGetDoc(key).then(function(res){ return res.ok ? (res.list || fallback) : fallback; });
  }
  function saveJSON(key, obj){
    return sSetDoc(key, obj);
  }

  // ---------------- digit normalization (Pashto/Persian & Arabic-Indic numerals) ----------------
  // Many phones default their keyboard to Pashto/Dari, which types numbers as
  // ۰۱۲۳۴۵۶۷۸۹ (Extended Arabic-Indic, U+06F0-06F9) or ٠١٢٣٤٥٦٧٨٩ (Arabic-Indic,
  // U+0660-0669) instead of plain 0-9. Every place in this app that reads a
  // number (phone/reference numbers, and the amount typed inside a comment)
  // must treat those the same as normal digits, or the value silently comes
  // out as empty/zero.
  function normalizeDigits(str){
    if(str==null) return str;
    return String(str).replace(/[\u06F0-\u06F9\u0660-\u0669]/g, function(ch){
      var code = ch.charCodeAt(0);
      if(code>=0x06F0 && code<=0x06F9) return String(code-0x06F0); // پښتو/دري ۰-۹
      if(code>=0x0660 && code<=0x0669) return String(code-0x0660); // عربي ٠-٩
      return ch;
    });
  }

    if((u.role==='admin' || u.role==='manager' || u.role==='nto') && saved.sessionToken && u.sessionToken && u.sessionToken!==saved.sessionToken){

  function ensureSeed(){
    return sGetDoc('users').then(function(res){
      if(!res.ok){
        // The read itself failed (offline/network/permission hiccup) --
        // we do NOT know whether real accounts exist on the server, so we
        // must not seed/overwrite anything here. Bubble this up as a
        // rejection so loadAll() can retry instead of wiping real data.
        return Promise.reject(res.err || new Error('users-read-failed'));
      }
      var users = res.list;
      if(users && users.length){
        state.users = users;
        var legacy = state.users.find(function(u){return u.username==='admin' && u.role==='admin';});
        if(legacy){
          legacy.username = DEFAULT_ADMIN_USER;
          legacy.password = DEFAULT_ADMIN_PASS;
          return persistUsers();
        }
        return;
      }
      // The read succeeded AND the users doc is genuinely empty/missing --
      // this only happens on the very first run, so it's safe to seed.
      var seeded = [{username:DEFAULT_ADMIN_USER, password:DEFAULT_ADMIN_PASS, role:'admin', status:'enabled', createdBy:'system'}];
      state.users = seeded;
      return saveJSON('users', seeded);
    });
  }

  // ---------------- REPAIR/MIGRATION: rebuild sales reports from approved bundles ----------------
  // Older approved bundles were saved in the bundles table but some of them
  // were never added to managerSales/ntoSales. On first load after this build,
  // rebuild both reports from ALL approved bundles exactly once. This also
  // prevents duplicate counting of old approvals. A Firestore transaction is
  // used so a simultaneous approval cannot leave the migration half-applied.
  var SALES_MIGRATION_KEY = 'approved-bundle-sales-v1';
  function migrateApprovedBundleSales(){
    return db.collection('appdata').doc('salesTotals').get().then(function(snap){
      var d = snap.exists ? (snap.data() || {}) : {};
      if(d._migrations && d._migrations[SALES_MIGRATION_KEY]) return;

      return db.runTransaction(function(tx){
        var bundlesRef = db.collection('appdata').doc('bundles');
        var totalsRef = db.collection('appdata').doc('salesTotals');
        return Promise.all([tx.get(bundlesRef), tx.get(totalsRef)]).then(function(reads){
          var bundlesSnap = reads[0];
          var totalsSnap = reads[1];
          var totals = totalsSnap.exists ? (totalsSnap.data() || {}) : {};
          if(totals._migrations && totals._migrations[SALES_MIGRATION_KEY]) return;

          var list = (bundlesSnap.exists && bundlesSnap.data().list) ? bundlesSnap.data().list : [];
          var managerSales = {};
          var ntoSales = {};

          list.forEach(function(b){
            if(!b || b.status!=='approved') return;
            var amt = extractNumber(b.comment);
            var ntoUser = b.ntoUsername;
            var mgrUser = b.actionedBy || findAssignedManager(ntoUser);

            if(ntoUser){
              if(!ntoSales[ntoUser]) ntoSales[ntoUser] = {total:0, count:0};
              ntoSales[ntoUser].total += amt;
              ntoSales[ntoUser].count += 1;
            }
            if(mgrUser){
              if(!managerSales[mgrUser]) managerSales[mgrUser] = {total:0, count:0};
              managerSales[mgrUser].total += amt;
              managerSales[mgrUser].count += 1;
            }
          });

          var migrations = totals._migrations || {};
          migrations[SALES_MIGRATION_KEY] = {completedAt:Date.now(), bundleCount:list.filter(function(b){return b && b.status==='approved';}).length};
          tx.set(totalsRef, {managerSales:managerSales, ntoSales:ntoSales, _migrations:migrations}, {merge:true});
        });
      }).then(function(){
        state.managerSales = {};
        state.ntoSales = {};
        return db.collection('appdata').doc('salesTotals').get();
      }).then(function(snap2){
        if(snap2.exists){
          var d2=snap2.data()||{};
          state.managerSales=d2.managerSales||{};
          state.ntoSales=d2.ntoSales||{};
        }
      });
    });
  }

  function rebuildSalesTotalsOnce(){
    var MIGRATION_VERSION = 4;
    return db.collection('appdata').doc('salesTotals').get().then(function(snap){
      var data=snap.exists?(snap.data()||{}):{};
      if(data.salesRebuildVersion===MIGRATION_VERSION) return;
      var mt={}, nt={};
      state.bundles.forEach(function(b){
        if(b.status!=='approved') return;
        var amt=extractNumber(b.comment||'');
        var n=b.ntoUsername;
        var resetN = (state.salesResetAt && state.salesResetAt.nto && state.salesResetAt.nto[n]) || 0;
        var resetCustomer = (state.customerSalesResetAt && state.customerSalesResetAt[n]) || 0;
        if((resetN && (Number(b.actionedAt)||0) <= Number(resetN)) ||
           (resetCustomer && (Number(b.actionedAt)||0) <= Number(resetCustomer))) return;
        if(n){if(!nt[n])nt[n]={total:0,count:0}; nt[n].total+=amt; nt[n].count++;}
        var m=null;
        if(b.actionedBy){var au=state.users.find(function(u){return u.username===b.actionedBy&&u.role==='manager';}); if(au)m=au.username;}
        if(!m)m=findAssignedManager(n);
        if(!m&&b.processingBy){var pu=state.users.find(function(u){return u.username===b.processingBy&&u.role==='manager';});if(pu)m=pu.username;}
        if(m){
          var resetM = (state.salesResetAt && state.salesResetAt.manager && state.salesResetAt.manager[m]) || 0;
          if(!(resetM && (Number(b.actionedAt)||0) <= Number(resetM))){
            if(!mt[m])mt[m]={total:0,count:0};mt[m].total+=amt;mt[m].count++;
          }
        }
      });
      state.managerSales=mt; state.ntoSales=nt;
      return db.collection('appdata').doc('salesTotals').set({managerSales:mt,ntoSales:nt,salesRebuildVersion:MIGRATION_VERSION},{merge:true});
    });
  }

  function rebuildSalesTotalsNow(){

      }),

      db.collection('appdata').doc('system').get().then(function(snap){

      }).catch(function(err){

      })
    ]).then(function(){ return rebuildSalesTotalsOnce(); });
  }

  // Retries the initial load a few times (with a short delay) before giving
  // up and showing an error screen. This protects against transient
  // network/Firestore hiccups being mistaken for "no data exists yet".
  function loadAll(retriesLeft){
    if(retriesLeft===undefined) retriesLeft = 5;
    return loadAllOnce().then(function(){
      state.loadError = false;
    }).catch(function(err){
      if(retriesLeft<=0){
        state.loadError = true;
        return;
      }
      return new Promise(function(resolve){ setTimeout(resolve, 1500); }).then(function(){
        return loadAll(retriesLeft-1);
      });
    });
  }

  function doLogin(){
    var u = document.getElementById('li-user').value.trim();
    var p = document.getElementById('li-pass').value;
    if(!u || !p){
      state.error = 'مهرباني وکړئ یوزر نوم او پاسورډ دواړه ولیکئ.';
      render(); return;
    }
    var found = state.users.find(function(x){return x.username===u;});
    if(!found || found.password!==p){
      state.error = 'یوزر نوم یا پاسورډ سم نه دی.';
      render(); return;
    }
    if(found.role==='nto' && found.status==='pending_admin'){
      state.error = 'ستاسو مشتری حساب لا د اډمین تایید ته په انتظار کې دی؛ تر تایید مخکې دننه کېدل نشئ کولی.';
      render(); return;
    }
    if(found.role==='nto' && found.status==='rejected_admin'){
      state.error = 'ستاسو حساب د اډمین لخوا رد شوی دی. دلیل: '+(found.adminReviewComment||'دلیل نه دی لیکل شوی.')+' مهرباني وکړئ له خپل مدیر سره اړیکه ونیسئ.';
      render(); return;
    }
    if(found.status==='disabled'){
      state.error = 'دا حساب غیر فعال شوی دی.';
      render(); return;
    }
    state.error='';
    state.currentUser = {username:found.username, role:found.role};
    state.section = MENUS[found.role][0].key;
    if(found.role==='admin' || found.role==='manager' || found.role==='nto'){
      var tok = uid();
      found.sessionToken = tok;
      state.mySessionToken = tok;
      persistUsers();
    }
    saveSession();
    requestNotificationPermission();
    render();
  }

  function doLogout(){
    var oldUsername = state.currentUser && state.currentUser.username;
    var oldUser = oldUsername ? state.users.find(function(x){return x.username===oldUsername;}) : null;
    // Stop notifications immediately and permanently remove this user's
    // registered push tokens. A browser can keep receiving FCM in the
    // background even after the page itself has been logged out, so simply
    // clearing localStorage is not enough.
    state.notifiedBundleIds = {};
    if(oldUser){ oldUser.fcmTokens = []; oldUser.notificationsEnabled = false; }
    try{
      if(messaging && messaging.deleteToken){ messaging.deleteToken().catch(function(){}); }
    }catch(e){}
    // Remove this username from the server-side FCM registry as well.
    // Without this, an old browser token can still receive background pushes
    // even though the web page itself has been logged out.
    if(oldUsername){ removeNotificationTokensForUser(oldUsername); }
    if(oldUser){ persistUsers().catch(function(){}); }
    state.currentUser = null;
    state.section = null;
    state.modal = null;
    state.userMenuOpen = false;
    state.mySessionToken = null;
    clearSavedSession();
    render();
  }

  // ---------------- ADMIN: DOWNLOAD ANY PAGE AS EXCEL ----------------

  function addAdminPageExport(headerRow, section){

  function exportAdminSection(section){
    var data = [];
    var sheet = section;
    if(section==='managers'){
      data = state.users.filter(function(u){return u.role==='manager';}).map(function(u){
        return {'یوزر-نوم':u.username,'حالت':u.status==='enabled'?'فعال':'غیر فعال'};
      });
      sheet='Managers';
    }else if(section==='ntos'){
      data = state.users.filter(function(u){return u.role==='nto';}).map(function(u){
        return {'یوزر-نوم':u.username,'ادرس':u.address||'','اړیکې شمیره':u.contact||'','جوړونکی':u.createdBy||'','حالت':u.status==='enabled'?'فعال':'غیر فعال'};
      });
      sheet='Customers';
    }else if(section==='rolls'){
      data = state.rolls.map(function(r){ return {'پیغام':r.text,'جوړونکی':r.createdBy||'','نیټه':fmtDate(r.createdAt)}; });
      sheet='Messages';
    }else if(section==='complaints'){
      data = state.complaints.map(function(c){ return {'مشتري':c.fromUsername||'','شکایت':c.text||'','نیټه':fmtDate(c.createdAt)}; });
      sheet='Complaints';
    }else return;
    if(!data.length){ showToast('هیڅ معلومات نشته چې ډاونلوډ شي.'); return; }
    try{
      var ws = XLSX.utils.json_to_sheet(data);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheet);
      XLSX.writeFile(wb, section+'-'+Date.now()+'.xlsx');
    }catch(e){ showToast('د ډاونلوډ کولو کې تېروتنه.'); }
  }

  function renderSection(main){

    main.innerHTML = '<div class="main-header" id="main-header-row"><div><h2>'+sectionTitle(state.section)+'</h2></div></div><div id="sec-body"></div>';
    var headerRow = document.getElementById('main-header-row');
    var body = document.getElementById('sec-body');

    // Everything below is wrapped in try/catch so that a bug in one section's
    // render code shows a visible error message instead of leaving the page
    // silently blank (which is very hard to debug on a phone with no console).
    try{
      if(state.section==='bundle' && role==='nto') return renderBundleSection(body);
      if(state.section==='deactivate' && role==='nto') return renderDeactivateSection(body);
      if(state.section==='managers' && role==='admin'){ renderUsersSection(body, 'manager', true, true, role); if(role==='admin') addAdminPageExport(headerRow, 'managers'); return; }
      if(state.section==='ntos' && (role==='admin'||role==='manager')){ renderUsersSection(body, 'nto', role==='admin', role==='admin', role); if(role==='admin') addAdminPageExport(headerRow, 'ntos'); return; }
      if(state.section==='sales') return renderSalesSection(body, role, headerRow);
      if(state.section==='report') return renderReportSection(body, role, headerRow);
      if(state.section==='nto_report' && (role==='admin'||role==='manager')) return renderNtoReportSection(body, headerRow, role);
      if(state.section==='manager_sales' && role==='admin') return renderManagerSalesSection(body, headerRow, role);
      if(state.section==='rolls' && role==='admin'){ renderRollsSection(body); addAdminPageExport(headerRow, 'rolls'); return; }
      if(state.section==='complaints') { renderComplaintsSection(body, role); if(role==='admin') addAdminPageExport(headerRow, 'complaints'); return; }

      body.innerHTML = '<div class="empty-state">لاسرسی نشته.</div>';
    }catch(e){
      console.error('renderSection error for section='+state.section+' role='+role, e);
      body.innerHTML = '<div class="card"><div class="empty-state" style="color:var(--danger);text-align:right;white-space:pre-wrap;">'+
        '⚠️ د دې پاڼې په ښودلو کې تېروتنه رامنځته شوه:\n'+
        escapeHtml(e && e.message ? e.message : String(e))+
        '</div></div>';
    }
  }

  // ---------------- SALES REPORT SECTION ----------------
  function renderSalesSection(body, role, headerRow){
    if(role==='manager') scheduleAssignWindowRefresh();
    var allRows = role==='nto' ? state.bundles.filter(function(b){return b.ntoUsername===state.currentUser.username;}) : state.bundles.slice();
    if(role==='manager'){
      // A bundle that's still within its assignment window and belongs to a
      // different manager's customer is completely hidden from this
      // manager's bundle page -- not just non-clickable -- until the window
      // elapses or it becomes theirs. Everything else (already
      // approved/rejected/etc., or unassigned customers) stays visible.
      allRows = allRows.filter(function(b){
        if(b.status==='approved' || b.status==='rejected' || b.status==='deactivated') return true;
        return isBundleClaimableByManager(b, state.currentUser.username);
      });
    }
    var rows = filterBySearch(allRows, state.bundleSearch, ['ntoUsername','field1','field2','comment','actionedBy']);
    // Resubmitted bundles are pinned to the very top of the list for every
    // role (admin/manager/nto), most-recently-resubmitted first. Everything
    // else keeps its existing relative order (Array#sort is stable).
    rows = rows.slice().sort(function(a,b){
      var ar = a.status==='resubmit' ? 1 : 0;
      var br = b.status==='resubmit' ? 1 : 0;
      if(ar!==br) return br-ar;
      if(ar===1 && br===1) return (b.waitStartAt||b.createdAt||0) - (a.waitStartAt||a.createdAt||0);
      return 0;
    });
    var canProcess = (role==='admin' || role==='manager');

    if(headerRow && (role==='admin' || role==='manager')){
      headerRow.innerHTML =
        '<div><h2>'+sectionTitle('sales')+'</h2></div>'+
        '<div class="header-actions">'+
          '<button class="icon-btn" id="sales-export" title="اکسیل ډاونلوډ">&#128190;</button>'+
          (role==='admin' ? '<button class="icon-btn" id="sales-reset" title="ریسیټ">&#8635;</button>' : '')+
        '</div>';

      document.getElementById('sales-export').onclick = function(){
        if(!rows.length){ showToast('هیڅ معلومات نشته چې ډاونلوډ شي.'); return; }
        var data = rows.map(function(b){
          var o = {};
          o['مشتري نوم'] = b.ntoUsername;
          o['اړيکې شميره'] = b.field1;
          o['بنډل نوم'] = b.field2;
          o['حالت'] = statusLabel(b.status);
          o['تائيد-مدير'] = b.actionedBy || '';

  function copyToClipboard(text){
    var done = function(){ showToast('شمیره کاپي شوه.'); };
    var fail = function(){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }catch(e){ showToast('کاپي نشو کیدلی.'); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(fail);
    }else{
      fail();
    }
  }

  // Masks everything except the last 3 characters of a number with '***'
  // (used to hide a customer's number from a manager until it's approved).
  function maskLast3Digits(str){
    str = String(str==null?'':str);
    if(str.length<=3) return '***';
    return escapeHtml(str.slice(0,-3))+'***';
  }

  // ---------------- ADMIN: delete a single bundle everywhere ----------------
  // Asks for confirmation, then removes just this one bundle from the shared
  // bundles table -- since every role reads the same table, this removes it
  // for all users (admin/manager/nto) at once.
  function deleteBundleById(bundleId){
    var b = state.bundles.find(function(x){return x.id===bundleId;});
    if(!b) return;
    var ok = window.confirm('آیا تاسو ډاډه یاست چې غواړئ دا بنډل ړنګ کړئ؟ دا کار به دا بنډل د ټولو یوزرانو لپاره ړنګ کړي او بیرته نشي کیدلی.');
    if(!ok) return;

    var amount = (b.status==='approved') ? extractNumber(b.comment||'') : 0;
    var customer = b.ntoUsername;
    var manager = b.actionedBy;
    if(!manager || !state.users.some(function(u){return u.username===manager && u.role==='manager';})){
      manager = findAssignedManager(customer);
    }

    var bundlesRef = db.collection('appdata').doc('bundles');
    var totalsRef = db.collection('appdata').doc('salesTotals');

    // Delete the bundle and remove its approved amount from BOTH reports in
    // the same Firestore transaction. This prevents another snapshot/client
    // from restoring the customer's sales after the manager sales were changed.
    db.runTransaction(function(tx){
      return Promise.all([tx.get(bundlesRef), tx.get(totalsRef)]).then(function(reads){
        var bundleSnap=reads[0], totalsSnap=reads[1];
        var list=(bundleSnap.exists && bundleSnap.data().list) ? bundleSnap.data().list.slice() : [];
        var current=list.find(function(x){return x.id===bundleId;});
        if(!current) return;

        var totals=totalsSnap.exists ? (totalsSnap.data()||{}) : {};
        var managerSales=totals.managerSales || {};
        var ntoSales=totals.ntoSales || {};

        if(current.status==='approved'){
          var amt=extractNumber(current.comment||'');
          var cu=current.ntoUsername;
          var mg=current.actionedBy;
          if(!mg || !state.users.some(function(u){return u.username===mg && u.role==='manager';})) mg=findAssignedManager(cu);

          // Customer report: remove exactly this deleted bundle's amount/count.
          if(cu && ntoSales[cu]){
            ntoSales[cu]={
              total:Math.max(0,(Number(ntoSales[cu].total)||0)-amt),
              count:Math.max(0,(Number(ntoSales[cu].count)||0)-1)
            };
          }
          // Manager report: remove exactly this deleted bundle's amount/count.
          if(mg && managerSales[mg]){
            managerSales[mg]={
              total:Math.max(0,(Number(managerSales[mg].total)||0)-amt),
              count:Math.max(0,(Number(managerSales[mg].count)||0)-1)
            };
          }
        }

        list=list.filter(function(x){return x.id!==bundleId;});
        tx.set(bundlesRef,{list:list},{merge:true});
        tx.set(totalsRef,{
          managerSales:managerSales,
          ntoSales:ntoSales,
          lastRebuildAt:Date.now()
        },{merge:true});
      });
    }).then(function(){
      state.bundles=state.bundles.filter(function(x){return x.id!==bundleId;});
      if(amount>0){
        if(customer && state.ntoSales[customer]){
          state.ntoSales[customer]={total:Math.max(0,(Number(state.ntoSales[customer].total)||0)-amount),count:Math.max(0,(Number(state.ntoSales[customer].count)||0)-1)};
        }
        if(manager && state.managerSales[manager]){
          state.managerSales[manager]={total:Math.max(0,(Number(state.managerSales[manager].total)||0)-amount),count:Math.max(0,(Number(state.managerSales[manager].count)||0)-1)};
        }
      }
      showToast('بنډل ړنګ شو او د مدیر او مشتری دواړو فروشات تازه شول.');
      renderDashboard(document.getElementById('app'));
    }).catch(function(err){
      console.error(err);
      showToast('د بنډل د ړنګولو پر مهال ستونزه وشوه.');
      renderDashboard(document.getElementById('app'));
    });
  }

  function badgeClass(status){
    if(status==='pending' || status==='pending_admin') return 'badge-pending';
    if(status==='in_process') return 'badge-process';
    if(status==='approved') return 'badge-approved';
    if(status==='rejected' || status==='rejected_admin') return 'badge-rejected';
    if(status==='resubmit') return 'badge-resubmit';
    if(status==='deactivated') return 'badge-deactivated';
    if(status==='enabled') return 'badge-enabled';
    if(status==='disabled') return 'badge-disabled';
    if(status==='pending_admin') return 'badge-pending';
    if(status==='rejected_admin') return 'badge-rejected';
    return '';
  }
  function statusLabel(status){
    if(status==='pending') return 'انتظار حالت کې';
    if(status==='in_process') return 'تر جريان لاندې شو';
    if(status==='approved') return 'فعاله شوو';
    if(status==='rejected') return 'رد شوى دى';
    if(status==='pending_admin') return 'د اډمین تایید ته انتظار';
    if(status==='rejected_admin') return 'د اډمین لخوا رد شوی';
    if(status==='resubmit') return 'بیا استول شوى';
    if(status==='deactivated') return 'غیري فعاله شو';
    if(status==='enabled') return 'فعاله';
    if(status==='disabled') return 'غیر فعاله';
    if(status==='pending_admin') return 'د اډمین تایید ته انتظار';
    if(status==='rejected_admin') return 'د اډمین لخوا رد شوی';
    return status;
  }
  function statusBadge(status){
    return '<span class="badge '+badgeClass(status)+'">'+statusLabel(status)+'</span>';
  }

  // ---------------- MANAGER ASSIGNMENT WINDOW (problem #4) ----------------
  // The manager who created a customer's account is that customer's "own"
  // manager. When the customer sends a fresh bundle (or resubmits one), it
  // is reserved for that manager for ASSIGN_WAIT_MS. If the assigned
  // manager hasn't acted on it by then, it opens up to every manager.
  function findAssignedManager(ntoUsername){
    var ntoUser = state.users.find(function(u){ return u.username===ntoUsername && u.role==='nto'; });
    if(!ntoUser || !ntoUser.createdBy) return null;
    var creator = state.users.find(function(u){ return u.username===ntoUser.createdBy && u.role==='manager'; });
    return creator ? creator.username : null;
  }
  function isBundleClaimableByManager(b, managerUsername){
    // Approved/rejected/deactivated bundles are already decided -- no more
    // contention over who may act on them, so always visible/claimable.
    if(b.status==='approved' || b.status==='rejected' || b.status==='deactivated') return true;
    var assignedMgr = findAssignedManager(b.ntoUsername);
    if(!assignedMgr) return true; // customer has no owning manager (e.g. created by admin) -- open to all immediately
    var startedAt = b.waitStartAt || b.createdAt || 0;
    if(Date.now() - startedAt >= ASSIGN_WAIT_MS) return true; // window elapsed -- open to all managers
    return managerUsername === assignedMgr;
  }
  // Schedules a single re-render once the soonest pending assignment window
  // in state.bundles elapses, so the UI/notifications update on their own
  // instead of requiring a manual refresh.
  function scheduleAssignWindowRefresh(){
    if(state.assignTimer){ clearTimeout(state.assignTimer); state.assignTimer=null; }
    if(!state.currentUser || state.currentUser.role!=='manager') return;
    var now = Date.now();
    var soonest = null;
    state.bundles.forEach(function(b){
      if(b.status==='approved' || b.status==='rejected' || b.status==='deactivated') return;
      if(isBundleClaimableByManager(b, state.currentUser.username)) return;
      var startedAt = b.waitStartAt || b.createdAt || 0;
      var remaining = (startedAt + ASSIGN_WAIT_MS) - now;
      if(remaining>0 && (soonest===null || remaining<soonest)) soonest = remaining;
    });
    if(soonest!==null){
      state.assignTimer = setTimeout(function(){
        state.assignTimer = null;
        checkForManagerEscalations();
        render();
      }, soonest+250);
    }
  }

  // ---------------- PROCESS MODAL (admin/manager: approve/reject) ----------------
  function openProcessModal(bundleId){
    var b = state.bundles.find(function(x){return x.id===bundleId;});
    if(!b) return;
    if(b.status!=='pending' && b.status!=='resubmit' && b.status!=='in_process') return;
    if(state.currentUser.role==='manager' && b.status==='in_process'){
      showToast('دا بنډل اوس د '+(b.processingBy||'بل مدیر')+' تر پروسس لاندې دی. لومړی باید حالت بیا د انتظار حالت ته راوګرځي.');
      return;
    }
    if(state.currentUser.role==='manager' && (b.status==='pending'||b.status==='resubmit') && !isBundleClaimableByManager(b, state.currentUser.username)){
      var ownMgr = findAssignedManager(b.ntoUsername);
      showToast('دا بنډل لومړی د '+ownMgr+' لپاره خوندي دی، مهرباني وکړئ لږ صبر وکړئ.');
      return;
    }
    // If it's already in_process (another manager started it but never
    // finished/cancelled -- e.g. closed the tab), take it over. Use the
    // originally-stored previous status so "لغوه کول" still reverts it
    // correctly instead of getting stuck on 'in_process' forever.
    var previousStatus = (b.status==='in_process') ? (b.prevStatusBeforeProcess || 'pending') : b.status;
    b.prevStatusBeforeProcess = previousStatus;
    b.status = 'in_process';
    b.processingBy = state.currentUser.username;
    // Open the modal immediately. Waiting for Firestore here made the status
    // click feel slow; the database write continues in the background.
    if(b.type==='deactivate'){
      state.modal = {type:'deactivate-confirm', bundleId:bundleId, previousStatus:previousStatus};
    }else{
      state.modal = {type:'process', bundleId:bundleId, previousStatus:previousStatus, draftComment:''};
    }
    render();
    persistBundles().catch(function(){
      var live=state.bundles.find(function(x){return x.id===bundleId;});
      if(live){ live.status=previousStatus; live.processingBy=null; live.prevStatusBeforeProcess=null; }
      state.modal=null;
      showToast('د بنډل حالت ثبت نه شو، مهرباني وکړئ بیا هڅه وکړئ.');
      render();
    });
  }

  function closeProcessModal(){
    if(!state.modal) return;
    var b = state.bundles.find(function(x){return x.id===state.modal.bundleId;});
    if(b && b.status==='in_process'){
      b.status = state.modal.previousStatus;
      b.processingBy = null;
      b.prevStatusBeforeProcess = null;
      persistBundles().then(function(){
        state.modal = null;
        render();
      });
    }else{
      state.modal = null;
      render();
    }
  }

  // Confirms, then rejects the bundle immediately with the given quick-phrase
  // as its note -- no separate "Reject" click needed afterwards.
  function confirmQuickReject(phrase){
    var ok = window.confirm('آیا ډاډه یاست چې غواړئ دا بنډل د "'+phrase+'" یادونې سره رد کړئ؟');
    if(!ok) return;
    submitProcessDecision('rejected', phrase);
  }

  function submitProcessDecision(decision, overrideComment){
    if(!state.modal) return;
    var commentEl = document.getElementById('proc-comment');
    var comment = (overrideComment!=null) ? overrideComment : (commentEl ? commentEl.value.trim() : '');
    if(!comment){ showToast('مهرباني وکړئ لومړی کمینټ ولیکئ.'); return; }
    var decisionBtns = ['proc-approve','proc-reject'].map(function(id){return document.getElementById(id);});
    decisionBtns.forEach(function(x){ if(x){x.disabled=true; x.style.opacity='.6';} });

    var b = state.bundles.find(function(x){return x.id===state.modal.bundleId;});
    if(!b) return;

    // IMPORTANT: determine the manager BEFORE clearing processingBy/action fields.
    // If a manager opened the bundle, processingBy is the safest source of the
    // manager identity. Admin approvals are assigned to the customer's manager.
    var approvedManager = null;
    if(decision==='approved'){
      if(b.processingBy){
        var processingMgr = state.users.find(function(u){
          return u.username===b.processingBy && u.role==='manager';
        });
        if(processingMgr) approvedManager = processingMgr.username;
      }
      if(!approvedManager && b.actionedBy){
        var actionMgr = state.users.find(function(u){
          return u.username===b.actionedBy && u.role==='manager';
        });
        if(actionMgr) approvedManager = actionMgr.username;
      }
      if(!approvedManager) approvedManager = findAssignedManager(b.ntoUsername);
      if(!approvedManager && state.currentUser.role==='manager') approvedManager = state.currentUser.username;
      if(!approvedManager){
        showToast('د دې مشتری لپاره مدیر پیدا نه شو؛ فروشات ثبت نه شول.');
        return;
      }
    }

    b.status = decision;
    b.comment = comment;
    b.actionedBy = state.currentUser.username;
    b.actionedAt = Date.now();
    b.processingBy = null;
    b.prevStatusBeforeProcess = null;
    b.ntoSeen = false;

    // Update the screen immediately. Do not wait for Firestore before closing
    // the modal: this makes Approve/Reject feel instant like a mobile app.
    var finishedMessage = decision==='approved' ? 'بنډل فعاله شو.' : 'بنډل رد شو.';
    state.modal = null;
    render();

    if(decision!=='approved'){
      persistBundles().then(function(){
        showToast('بنډل رد شو.');
      }).catch(function(err){
        console.error(err);
        showToast('د بنډل د ثبت پر مهال تېروتنه وشوه.');
      });
      return;
    }

    var amount = extractNumber(comment);
    var ntoUser = b.ntoUsername;
    var totalsRef = db.collection('appdata').doc('salesTotals');

    // Optimistically update the visible sales counters before the network
    // transaction completes. The transaction below remains the source of truth.
    if(!state.managerSales[approvedManager]) state.managerSales[approvedManager] = {total:0,count:0};
    state.managerSales[approvedManager] = {
      total:(Number(state.managerSales[approvedManager].total)||0) + amount,
      count:(Number(state.managerSales[approvedManager].count)||0) + 1
    };
    if(ntoUser){
      if(!state.ntoSales[ntoUser]) state.ntoSales[ntoUser] = {total:0,count:0};
      state.ntoSales[ntoUser] = {
        total:(Number(state.ntoSales[ntoUser].total)||0) + amount,
        count:(Number(state.ntoSales[ntoUser].count)||0) + 1
      };
    }
    showToast('بنډل فعاله شو او فروشات ثبتېږي...');
    var bundlesRef = db.collection('appdata').doc('bundles');
    var bundleList = state.bundles.slice();

    // Save the approval and both sales reports in one Firestore transaction.
    // Do NOT use dotted field paths such as managerSales.<username> because a
    // username can contain characters that Firestore interprets as path syntax.
    // Reading the whole maps and writing them back also guarantees that the
    // number entered in the comment is actually persisted for both accounts.
    db.runTransaction(function(tx){
      return Promise.all([tx.get(totalsRef), tx.get(bundlesRef)]).then(function(reads){
        var totalsSnap = reads[0];
        var bundlesSnap = reads[1];
        var totals = totalsSnap.exists ? (totalsSnap.data()||{}) : {};
        var managerSales = totals.managerSales || {};
        var ntoSales = totals.ntoSales || {};

        if(!managerSales[approvedManager]) managerSales[approvedManager] = {total:0,count:0};
        managerSales[approvedManager] = {
          total:(Number(managerSales[approvedManager].total)||0) + amount,
          count:(Number(managerSales[approvedManager].count)||0) + 1
        };

        if(ntoUser){
          if(!ntoSales[ntoUser]) ntoSales[ntoUser] = {total:0,count:0};
          ntoSales[ntoUser] = {
            total:(Number(ntoSales[ntoUser].total)||0) + amount,
            count:(Number(ntoSales[ntoUser].count)||0) + 1
          };
        }

        tx.set(totalsRef, {
          managerSales: managerSales,
          ntoSales: ntoSales,
          lastApprovalAt: Date.now()
        }, {merge:true});
        tx.set(bundlesRef, {list: bundleList}, {merge:true});
      });
    }).then(function(){
      showToast('بنډل فعاله شو او فروشات د مشتری او مدیر دواړو حسابونو ته جمع شول.');
    }).catch(function(err){
      console.error(err);
      // The server transaction is authoritative. Reload the persisted totals
      // if the background write fails, without reopening the modal.
      return totalsRef.get().then(function(snap){
        var d = snap.exists ? (snap.data()||{}) : {};
        state.managerSales = d.managerSales || {};
        state.ntoSales = d.ntoSales || {};
        render();
        showToast('د فعالولو یا فروشاتو د ثبت پر مهال تېروتنه وشوه. بیا هڅه وکړئ.');
      }).catch(function(){
        showToast('د فعالولو یا فروشاتو د ثبت پر مهال تېروتنه وشوه. بیا هڅه وکړئ.');
      });
    });
  }

    }else if(state.modal.type==='edit-bundle'){
      var eb=state.bundles.find(function(x){return x.id===state.modal.bundleId;});
      layer.innerHTML='<div class="modal-card"><h3>د بنډل ټول معلومات ایډیټ</h3><div class="field"><label>مشتري یوزرنوم</label><input id="eb-nto" value="'+escapeHtml(eb?eb.ntoUsername:'')+'"></div><div class="field"><label>شمیره</label><input id="eb-f1" value="'+escapeHtml(eb?eb.field1:'')+'"></div><div class="field"><label>د بنډل نوم</label><input id="eb-f2" value="'+escapeHtml(eb?eb.field2:'')+'"></div><div class="field"><label>حالت</label><select id="eb-status"><option value="pending">انتظار حالت کې</option><option value="in_process">تر جريان لاندې شو</option><option value="approved">فعاله شو</option><option value="rejected">رد شوى دى</option><option value="resubmit">بیا استول شوى</option><option value="deactivated">غیري فعاله شو</option></select></div><div class="field"><label>یادونه</label><textarea id="eb-comment" rows="3">'+escapeHtml(eb?eb.comment||'':'')+'</textarea></div><div class="field"><label>تائید کوونکی مدیر</label><select id="eb-actioned"><option value="">— مدیر انتخاب کړئ —</option>'+state.users.filter(function(u){return u.role==='manager';}).map(function(m,i){return '<option value="'+escapeHtml(m.username)+'">'+(i+1)+' - '+escapeHtml(m.username)+'</option>';}).join('')+'</select></div><div class="modal-actions"><button class="btn btn-gold" id="eb-save">ذخیره</button><button class="btn btn-ghost" id="eb-cancel">لغوه کول</button></div></div>';
      setTimeout(function(){var sel=document.getElementById('eb-status');if(sel&&eb)sel.value=eb.status;},0);
    }

    if(state.modal.type==='edit-user'){
      var eu2=state.users.find(function(x){return x.username===state.modal.username;});
      if(eu2){
        document.getElementById('eu-cancel').onclick=function(){state.modal=null;render();};
        document.getElementById('eu-save').onclick=function(){
          var oldName=state.modal.username,u=state.users.find(function(x){return x.username===oldName;}); if(!u)return;
          var newName=document.getElementById('eu-user').value.trim(), newPass=document.getElementById('eu-pass').value.trim();
          if(!newName||!newPass){showToast('یوزرنوم او پاسورډ دواړه اړین دي.');return;}
          if(newName!==oldName&&state.users.some(function(x){return x.username===newName;})){showToast('دا یوزرنوم مخکې شتون لري.');return;}
          u.username=newName;u.password=newPass;u.status=document.getElementById('eu-status').value;u.createdBy=document.getElementById('eu-createdBy').value.trim();
          if(u.role==='nto'){u.address=document.getElementById('eu-addr').value.trim();u.contact=document.getElementById('eu-contact').value.trim();}
          if(newName!==oldName){state.users.forEach(function(x){if(x.createdBy===oldName)x.createdBy=newName;});state.bundles.forEach(function(b){if(b.ntoUsername===oldName)b.ntoUsername=newName;if(b.actionedBy===oldName)b.actionedBy=newName;if(b.processingBy===oldName)b.processingBy=newName;});}
          persistUsers().then(function(){return persistBundles();}).then(function(){return rebuildSalesTotalsNow();}).then(function(){state.modal=null;showToast('یوزر معلومات ذخیره شوې.');render();}).catch(function(){showToast('د معلوماتو د ذخیره کولو پر مهال تېروتنه وشوه.');});
        };
      }
    }else if(state.modal.type==='edit-bundle'){
      var eb2=state.bundles.find(function(x){return x.id===state.modal.bundleId;});
      if(eb2){
        document.getElementById('eb-cancel').onclick=function(){state.modal=null;render();};
        document.getElementById('eb-save').onclick=function(){
          var b=state.bundles.find(function(x){return x.id===state.modal.bundleId;});if(!b)return;
          var n=document.getElementById('eb-nto').value.trim(), f1=normalizeDigits(document.getElementById('eb-f1').value.trim()).replace(/[^0-9]/g,''), f2=document.getElementById('eb-f2').value.trim(), st=document.getElementById('eb-status').value, c=document.getElementById('eb-comment').value.trim(), m=document.getElementById('eb-actioned').value;
          if(!n||!f1||!f2){showToast('مشتري، شمیره او د بنډل نوم اړین دي.');return;}
          if(st==='approved'&&!m){showToast('د تایید کوونکي مدیر انتخاب وکړئ.');return;}

          // Keep the old approved contribution so an admin edit can correctly
          // remove it from the OLD customer/manager before applying the new one.
          var oldB=JSON.parse(JSON.stringify(b));
          var now=Date.now();
          b.ntoUsername=n;b.field1=f1;b.field2=f2;b.status=st;b.comment=c;
          b.actionedBy=st==='approved'?m:(st==='rejected'?b.actionedBy:null);
          if(st==='approved') b.actionedAt=now; else b.actionedAt=null;
          b.processingBy=null;b.prevStatusBeforeProcess=null;

          var totalsRef=db.collection('appdata').doc('salesTotals');
          var bundlesRef=db.collection('appdata').doc('bundles');
          var newList=state.bundles.slice();
          var resetN=state.salesResetAt||{manager:{},nto:{}};
          var resetCustomer=state.customerSalesResetAt||{};

          function contribution(x){
            if(!x || x.status!=='approved') return null;
            var amount=extractNumber(x.comment||'');
            var customer=x.ntoUsername||null;
            var manager=x.actionedBy;
            if(!manager || !state.users.some(function(u){return u.username===manager&&u.role==='manager';})) manager=findAssignedManager(customer);
            var customerReset=resetN.nto&&resetN.nto[customer]||resetCustomer[customer]||0;
            var managerReset=resetN.manager&&resetN.manager[manager]||0;
            var activeCustomer=!(customerReset && (Number(x.actionedAt)||0)<=Number(customerReset));
            var activeManager=!(managerReset && (Number(x.actionedAt)||0)<=Number(managerReset));
            return {amount:amount,customer:customer,manager:manager,activeCustomer:activeCustomer,activeManager:activeManager};
          }

          db.runTransaction(function(tx){
            return tx.get(totalsRef).then(function(snap){
              var d=snap.exists?(snap.data()||{}):{};
              var managerSales=JSON.parse(JSON.stringify(d.managerSales||{}));
              var ntoSales=JSON.parse(JSON.stringify(d.ntoSales||{}));

              function addMap(map,key,amount,countDelta){
                if(!key)return;
                if(!map[key])map[key]={total:0,count:0};
                map[key].total=(Number(map[key].total)||0)+amount;
                map[key].count=(Number(map[key].count)||0)+countDelta;
                if(map[key].count<0)map[key].count=0;
                if(map[key].total<0)map[key].total=0;
              }
              function removeContribution(x){
                var q=contribution(x); if(!q)return;
                if(q.activeCustomer) addMap(ntoSales,q.customer,-q.amount,-1);
                if(q.activeManager) addMap(managerSales,q.manager,-q.amount,-1);
              }
              function addContribution(x){
                var q=contribution(x); if(!q)return;
                if(q.activeCustomer) addMap(ntoSales,q.customer,q.amount,1);
                if(q.activeManager) addMap(managerSales,q.manager,q.amount,1);
              }

              // First remove the exact old approved contribution, then add the
              // exact new approved contribution. This fixes status changes,
              // comment changes, customer changes, and manager changes.
              removeContribution(oldB);
              addContribution(b);

              tx.set(bundlesRef,{list:newList},{merge:true});
              tx.set(totalsRef,{managerSales:managerSales,ntoSales:ntoSales,lastBundleEditAt:now},{merge:true});
            });
          }).then(function(){
            return totalsRef.get();
          }).then(function(snap){
            var d=snap.exists?(snap.data()||{}):{};
            state.managerSales=d.managerSales||{};
            state.ntoSales=d.ntoSales||{};
            state.modal=null;
            showToast('د بنډل معلومات او فروشاتو راپور تازه شو.');
            render();
          }).catch(function(err){
            console.error(err);
            // Restore local state if the transaction failed.
            var idx=state.bundles.findIndex(function(x){return x.id===oldB.id;});
            if(idx>=0) state.bundles[idx]=oldB;
            showToast('د بنډل د ذخیره کولو پر مهال تېروتنه وشوه.');
          });
        };
      }
    }

    if(state.modal.type==='confirm-logout'){
      document.getElementById('cl-confirm').onclick = doLogout;
      document.getElementById('cl-cancel').onclick = function(){ state.modal=null; render(); };
    }else if(state.modal.type==='confirm-desktop'){
      document.getElementById('cd-confirm').onclick = function(){
        state.forceDesktop = !state.forceDesktop;
        document.body.classList.toggle('force-desktop', state.forceDesktop);
        state.modal = null;
        render();
      };
      document.getElementById('cd-cancel').onclick = function(){ state.modal=null; render(); };
    }else if(state.modal.type==='change-password'){
      document.getElementById('pw-submit').onclick = submitChangePassword;
      document.getElementById('pw-cancel').onclick = function(){ state.modal=null; state.pwError=''; render(); };
    }else if(state.modal.type==='process'){
      document.getElementById('proc-approve').onclick = function(){ submitProcessDecision('approved'); };
      document.getElementById('proc-reject').onclick = function(){ submitProcessDecision('rejected'); };
      document.getElementById('proc-cancel').onclick = closeProcessModal;
      document.getElementById('proc-quick-1').onclick = function(){ confirmQuickReject('پیسې اضافه کړه'); };
      document.getElementById('proc-quick-2').onclick = function(){ confirmQuickReject('پیسې کمې دي'); };
      document.getElementById('proc-quick-3').onclick = function(){ confirmQuickReject('شمیره غلطه ده'); };
      (function(){
        var copyBtn = document.getElementById('proc-copy-number');
        if(copyBtn){ copyBtn.onclick = function(){ var pb = state.bundles.find(function(x){return x.id===state.modal.bundleId;}); if(pb) copyToClipboard(pb.field1); }; }
      })();
      (function(){
        var pc = document.getElementById('proc-comment');
        if(pc){ pc.addEventListener('input', function(){ if(state.modal) state.modal.draftComment = pc.value; }); }
      })();
    }else if(state.modal.type==='deactivate-confirm'){
      document.getElementById('deact-confirm').onclick = function(){
        var ok=window.confirm('ایا ډاډه یاست چې دا غوښتنه غیر فعاله شوه؟');
        if(ok) submitDeactivate();
      };
      document.getElementById('deact-wrong').onclick = function(){
        var ok=window.confirm('ایا ډاډه یاست چې شمیره غلطه ده او غوښتنه رد کړئ؟');
        if(ok){
          var b=state.bundles.find(function(x){return x.id===state.modal.bundleId;});
          if(!b) return;
          b.status='rejected'; b.comment='شميره غلطه ده'; b.actionedBy=state.currentUser.username; b.actionedAt=Date.now(); b.processingBy=null; b.prevStatusBeforeProcess=null; b.ntoSeen=false;
          persistBundles().then(function(){state.modal=null;showToast('غوښتنه رد شوه.');render();});
        }
      };
      document.getElementById('deact-cancel').onclick = closeProcessModal;
    }else if(state.modal.type==='resubmit'){
      document.getElementById('resub-submit').onclick = submitResubmit;
      document.getElementById('resub-cancel').onclick = function(){ state.modal=null; render(); };
      (function(){
        var rc = document.getElementById('resub-comment');
        if(rc){ rc.addEventListener('input', function(){ if(state.modal) state.modal.draftComment = rc.value; }); }
      })();
    }
  }

  // ---------------- USERS SECTIONS (managers / ntos) ----------------
  function renderUsersSection(body, targetRole, canToggle, canDelete, viewerRole){
    // Managers only see the customer accounts THEY created; other managers'
    // customers stay hidden from them. Admin still sees everyone.
    var fullList = state.users.filter(function(u){
      if(u.role!==targetRole) return false;
      if(targetRole==='nto' && viewerRole==='manager' && u.createdBy!==state.currentUser.username) return false;
      return true;
    });
    var roleLabel = targetRole==='manager' ? 'مدير' : 'مشتري';
    var isNto = targetRole==='nto';
    var searchFields = isNto ? ['username','address','contact','createdBy'] : ['username'];
    var list = filterBySearch(fullList, state.userSearch[targetRole], searchFields);

    body.innerHTML =
      '<div class="card">'+
        '<h4>نوی '+roleLabel+' حساب جوړ کړئ</h4>'+
        '<div class="row">'+
          '<div class="field"><label>یوزرنوم</label><input id="nu-user" type="text" value="'+escapeHtml((state.userDraft[targetRole]&&state.userDraft[targetRole].username)||'')+'"></div>'+
          '<div class="field"><label>پاسورډ</label><input id="nu-pass" type="text" value="'+escapeHtml((state.userDraft[targetRole]&&state.userDraft[targetRole].password)||'')+'"></div>'+
          (isNto ? '<div class="field"><label>ادرس</label><input id="nu-addr" type="text" value="'+escapeHtml((state.userDraft[targetRole]&&state.userDraft[targetRole].address)||'')+'"></div>'+
                   '<div class="field"><label>اړیکې شمیره</label><input id="nu-contact" type="text" value="'+escapeHtml((state.userDraft[targetRole]&&state.userDraft[targetRole].contact)||'')+'"></div>' : '')+
          '<button class="btn btn-gold" id="nu-create">جوړ کړئ</button>'+
        '</div>'+
      '</div>'+
      '<div class="card"><h4>د '+roleLabel+' حسابونه</h4>'+
        (fullList.length ? '<div class="search-row"><input id="nu-search" type="text" placeholder="د '+roleLabel+' لټون (یوزرنوم'+(isNto?'، ادرس یا شمیره':'')+')..." value="'+escapeHtml(state.userSearch[targetRole])+'"><span class="search-icon">&#128269;</span></div>' : '')+
        '<div id="nu-list"></div><div id="nu-pager"></div></div>';

    function syncUserDraft(){
      state.userDraft[targetRole] = {username:(document.getElementById('nu-user')||{}).value||'',password:(document.getElementById('nu-pass')||{}).value||'',address:(document.getElementById('nu-addr')||{}).value||'',contact:(document.getElementById('nu-contact')||{}).value||''};
    }
    ['nu-user','nu-pass','nu-addr','nu-contact'].forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener('input',syncUserDraft); });
    document.getElementById('nu-create').onclick = function(){
      var u = document.getElementById('nu-user').value.trim();
      var p = document.getElementById('nu-pass').value.trim();
      var addr = isNto ? document.getElementById('nu-addr').value.trim() : '';
      var contact = isNto ? document.getElementById('nu-contact').value.trim() : '';
      if(!u || !p){ showToast('یوزرنوم او پاسورډ دواړه ولیکئ.'); return; }
      if(isNto && (!addr || !contact)){ showToast('ادرس او اړیکې شمیره هم ولیکئ.'); return; }
      if(state.users.find(function(x){return x.username===u;})){ showToast('دا یوزرنوم مخکې شتون لري.'); return; }
      var newUser = {username:u, password:p, role:targetRole, status:(isNto && viewerRole==='manager' ? 'pending_admin' : 'enabled'), createdBy:state.currentUser.username, createdAt:Date.now()};
      if(isNto){ newUser.address = addr; newUser.contact = contact; }
      state.users.push(newUser);
      persistUsers().then(function(){
        state.userDraft[targetRole] = {username:'',password:'',address:'',contact:''};
        showToast(roleLabel+' حساب جوړ شو.');
        renderSection(document.getElementById('main-area'));
      });
    };

    if(fullList.length){
      bindSearchInput('nu-search', function(){return state.userSearch[targetRole];}, function(v){state.userSearch[targetRole]=v; state.userPage[targetRole]=0;}, function(){ renderUsersSection(body, targetRole, canToggle, canDelete, viewerRole); });
    }

    var listEl = document.getElementById('nu-list');
    if(!fullList.length){
      listEl.innerHTML = '<div class="empty-state">تر اوسه هیڅ حساب نشته.</div>';
      return;
    }
    if(!list.length){
      listEl.innerHTML = '<div class="empty-state">ستاسو د لټون سره سم هیڅ حساب ونه موندل شو.</div>';
      return;
    }

    var page = state.userPage[targetRole] || 0;
    var pageCount = Math.max(1, Math.ceil(list.length/PAGE_SIZE));
    if(page>pageCount-1) page = pageCount-1;
    if(page<0) page = 0;
    state.userPage[targetRole] = page;
    var pageList = list.slice(page*PAGE_SIZE, (page+1)*PAGE_SIZE);

    listEl.innerHTML = '<div style="overflow-x:auto;"><table><thead><tr><th>یوزر-نوم</th>'+(canDelete?'<th>پاسورډ</th>':'')+
      (isNto ? '<th>مشتري-ادرس</th><th>اړیکې-شمیره</th><th>جوړونکی</th>' : '')+
      '<th>حالت</th>'+(canToggle || (viewerRole==='manager' && isNto)?'<th></th>':'')+(canDelete?'<th></th><th></th>':'')+'</tr></thead><tbody>'+
      pageList.map(function(u){
        return '<tr><td data-label="یوزر-نوم">'+escapeHtml(u.username)+'</td>'+(canDelete?'<td data-label="پاسورډ"><span dir="ltr">'+escapeHtml(u.password||'')+'</span></td>':'')+
          (isNto ? '<td data-label="مشتري-ادرس">'+escapeHtml(u.address||'—')+'</td><td data-label="اړیکې-شمیره">'+escapeHtml(u.contact||'—')+'</td><td data-label="جوړونکی">'+escapeHtml(u.createdBy||'—')+'</td>' : '')+
          '<td data-label="حالت">'+statusBadge(u.status==='enabled'?'enabled':(u.status||'disabled'))+(u.adminReviewComment ? '<div class="small-muted" style="margin-top:5px;">'+escapeHtml(u.adminReviewComment)+'</div>' : '')+'</td>'+
          (canToggle ? '<td>'+ (u.status==='pending_admin' ? '<button class="btn btn-sm btn-ok" data-approve-user="'+u.username+'">تایید</button> <button class="btn btn-sm btn-danger" data-reject-user="'+u.username+'">رد</button>' : '<button class="btn btn-sm '+(u.status==='enabled'?'btn-danger':'btn-ok')+'" data-toggle="'+u.username+'">'+(u.status==='enabled'?'غیر فعالول':'فعالول')+'</button>') +'</td>' : (viewerRole==='manager' && isNto && u.status==='rejected_admin' ? '<td><button class="btn btn-sm btn-info" data-resubmit-user="'+u.username+'">بیا ځلې اډمین ته لیږل</button></td>' : ''))+
          (canDelete ? '<td><button class="icon-btn-sm" data-edit-user="'+u.username+'" title="ایډیټ">&#9998;</button></td><td><button class="icon-btn-sm" data-delete-user="'+u.username+'" title="ډیلیټ">&#128465;</button></td>' : '')+
        '</tr>';
      }).join('')+
    '</tbody></table></div>';

    renderPager(document.getElementById('nu-pager'), page, list.length, function(np){
      state.userPage[targetRole] = np;
      renderUsersSection(body, targetRole, canToggle, canDelete, viewerRole);
    });

    if(canToggle){
      Array.prototype.forEach.call(document.querySelectorAll('[data-toggle]'), function(btn){
        btn.onclick = function(){
          var uname = btn.getAttribute('data-toggle');
          var u = state.users.find(function(x){return x.username===uname;});
          if(u){
            u.status = u.status==='enabled' ? 'disabled' : 'enabled';
            persistUsers().then(function(){
              showToast('د '+uname+' حالت بدل شو.');
              renderSection(document.getElementById('main-area'));
            });
          }
        };
      });
    }
    if(canToggle){
      Array.prototype.forEach.call(document.querySelectorAll('[data-approve-user]'), function(btn){
        btn.onclick=function(){ var u=state.users.find(function(x){return x.username===btn.getAttribute('data-approve-user');}); if(!u)return; u.status='enabled'; u.adminReviewComment=''; u.managerResubmitComment=''; persistUsers().then(function(){showToast('مشتري تایید شو.');renderSection(document.getElementById('main-area'));}); };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-reject-user]'), function(btn){
        btn.onclick=function(){ var u=state.users.find(function(x){return x.username===btn.getAttribute('data-reject-user');}); if(!u)return; var c=window.prompt('د رد کولو دلیل ولیکئ:',''); if(c===null)return; u.status='rejected_admin'; u.adminReviewComment=c.trim(); persistUsers().then(function(){showToast('مشتري رد شو.');renderSection(document.getElementById('main-area'));}); };
      });
    }
    if(viewerRole==='manager'){
      Array.prototype.forEach.call(document.querySelectorAll('[data-resubmit-user]'), function(btn){
        btn.onclick=function(){
          var uname=btn.getAttribute('data-resubmit-user');
          var u=state.users.find(function(x){return x.username===uname && x.role==='nto';});
          if(!u) return;
          var c=window.prompt('د بیا استولو کمینټ ولیکئ (اختیاري):','');
          if(c===null) return;
          u.status='pending_admin';
          u.managerResubmitComment=c.trim();
          persistUsers().then(function(){showToast('مشتري بیا د اډمین تایید ته واستول شو.');renderSection(document.getElementById('main-area'));});
        };
      });
    }
    if(canDelete || (viewerRole==='manager' && isNto)){
      Array.prototype.forEach.call(document.querySelectorAll('[data-edit-user]'), function(btn){
        btn.onclick=function(){ openUserEditModal(btn.getAttribute('data-edit-user')); };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-delete-user]'), function(btn){
        btn.onclick = function(){
          var uname = btn.getAttribute('data-delete-user');
          var ok = window.confirm('آیا ډاډه یاست چې غواړئ '+uname+'حساب ډیلیټ کړئ.');
          if(!ok) return;
          state.users = state.users.filter(function(x){return x.username!==uname;});
          persistUsers().then(function(){
            showToast(uname+' حساب ډیلیټ شو.');
            renderSection(document.getElementById('main-area'));
          });
        };
      });
    }

  // ---------------- SALES FOR OTHER MANAGERS' CUSTOMERS ----------------
  // Shows approved bundles where a manager processed a customer who belongs
  // to a different manager. For a manager, only that manager's own actions
  // are shown; Admin sees the combined report grouped by customer owner.
  function getOtherManagerSalesRows(viewerRole, viewerUsername){
    var grouped = {};
    var resetMap = state.otherManagerSalesResetAt || {};
    state.bundles.forEach(function(b){
      if(!b || b.status!=='approved') return;
      var owner = findAssignedManager(b.ntoUsername);
      var actor = b.actionedBy;
      if(!owner || !actor || owner===actor) return;
      if(!state.users.some(function(u){return u.username===actor && u.role==='manager';})) return;
      if(viewerRole==='manager' && actor!==viewerUsername) return;
      var resetAt=Number(resetMap[owner]||0), actionedAt=Number(b.actionedAt)||0;
      if(resetAt && actionedAt<=resetAt) return;
      if(!grouped[actor]) grouped[actor]={};
      if(!grouped[actor][owner]) grouped[actor][owner]={total:0,count:0};
      grouped[actor][owner].total += extractNumber(b.comment||'');
      grouped[actor][owner].count += 1;
    });
    return Object.keys(grouped).sort().map(function(actor){
      return {actor:actor, rows:Object.keys(grouped[actor]).sort().map(function(owner){
        return {username:owner,count:grouped[actor][owner].count,total:grouped[actor][owner].total};
      })};
    });
  }

  // ---------------- REPORT SECTION ----------------
  function extractNumber(str){
    if(!str) return 0;
    var normalized = normalizeDigits(str);
    // Strip thousands-separator commas (e.g. "1,500") so amounts typed with
    // commas are still picked up as a single number instead of just "1".
    var cleaned = normalized.replace(/(\d),(?=\d{3}(\D|$))/g, '$1');
    var m = cleaned.match(/\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : 0;
  }
  function dateKeyOf(ts){
    var d = new Date(ts);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  // ---------------- utils ----------------
  function fmtDate(ts){
