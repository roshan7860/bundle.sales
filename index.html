<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Roshan Bundle Activation</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101826">
<meta name="app-build-version" content="1.7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="روشن پورټال">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6675;
    --sidebar:#101826;
    --sidebar-text:#C9D1DB;
    --sidebar-text-dim:#7C8698;
    --accent:#B8862B;
    --accent-soft:#F3E7CE;
    --ok:#2E7D5B;
    --ok-soft:#DFF0E7;
    --danger:#B3432B;
    --danger-soft:#F6E1DA;
    --info:#2E5FA3;
    --info-soft:#DDE8F6;
    --border:#DDE2E8;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:contain;}
  body{
    font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    color:var(--ink);
    direction:rtl;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  button,.btn,.nav-item,.icon-btn,.icon-btn-sm,.icon-btn-copy,input,select,textarea{touch-action:manipulation;}
  #app{min-height:100vh;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 85% 10%, rgba(184,134,43,0.18), transparent 45%),
      linear-gradient(180deg, #101826 0%, #182234 100%);
  }
  .login-card{
    background:var(--surface);
    width:100%;
    max-width:380px;
    border-radius:16px;
    padding:36px 30px;
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
  }
  .login-brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .login-brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,#B8862B,#8f6a20);
    flex:none;
  }
  .login-brand .roshan-login-logo{
    width:150px;height:auto;max-height:78px;object-fit:contain;display:block;
    border-radius:10px;background:#fff;padding:4px;box-sizing:border-box;
    flex:none;
  }
  .login-brand span{font-weight:800;font-size:19px;letter-spacing:.2px;}
  .login-card p.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 26px 0;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input, .field textarea, .field select{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--border);
    border-radius:8px;
    font-family:inherit;
    font-size:14.5px;
    background:#FBFCFD;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .field input:disabled, .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 18px;
    border-radius:8px;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:filter .15s, transform .05s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-gold{background:var(--accent);color:#fff;}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-ok:hover{filter:brightness(1.1);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{filter:brightness(1.1);}
  .btn-info{background:var(--info);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:6px;}
  .icon-btn{
    width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);
    background:#fff;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;
  }
  .icon-btn:hover{border-color:var(--accent);}
  .icon-btn-sm{
    width:28px;height:28px;border-radius:7px;border:1.5px solid var(--border);
    background:#fff;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:14px;color:var(--danger);
  }
  .icon-btn-sm:hover{border-color:var(--danger);background:var(--danger-soft);}
  .icon-btn-copy{
    border:none;background:transparent;cursor:pointer;font-size:13px;
    color:var(--ink-soft);padding:2px 4px;vertical-align:middle;
  }
  .icon-btn-copy:hover{color:var(--accent);}
  .error-box{
    background:var(--danger-soft);color:var(--danger);
    border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:16px;font-weight:600;
  }

  /* ---------- Disabled full screen ---------- */
  .blocked-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:#101826;
  }
  .blocked-card{
    background:#fff;border-radius:16px;padding:40px 32px;max-width:420px;text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,.35);
  }
  .blocked-card .icon .ui-icon{width:27px;height:27px;}
  .blocked-card .icon{
    width:56px;height:56px;border-radius:50%;background:var(--danger-soft);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px auto;
    font-size:26px;color:var(--danger);
  }
  .blocked-card h3{margin:0 0 10px 0;font-size:17px;}
  .blocked-card p{color:var(--ink-soft);font-size:14px;line-height:1.8;direction:ltr;text-align:center;}

  /* ---------- Dashboard layout ---------- */
  /* Sidebar is an overlay drawer on ALL screen sizes: hidden by default,
     opened/closed via the hamburger icon in the top bar. */
  .shell{position:relative;}
  .sidebar-backdrop{
    position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:54;
    display:none;
  }
  .sidebar-backdrop.show{display:block;}
  body.force-desktop .sidebar-backdrop{display:none !important;}
  .sidebar{
    width:236px;background:var(--sidebar);color:var(--sidebar-text);
    display:none;
    flex-direction:column;padding:22px 16px;
    position:fixed;top:0;right:0;height:100vh;z-index:55;
    box-shadow:0 12px 24px rgba(0,0,0,.3);
    overflow-y:auto;
  }
  .sidebar.mobile-open{display:flex;}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px 6px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:18px;}
  .sidebar .brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#B8862B,#8f6a20);flex:none;}
  .sidebar .brand b{font-size:15.5px;}
  .sidebar .role-tag{
    font-size:11.5px;color:var(--sidebar-text-dim);
    background:rgba(255,255,255,.06);
    display:inline-block;padding:3px 10px;border-radius:20px;margin-bottom:18px;
  }
  .nav-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 12px;border-radius:8px;margin-bottom:4px;
    color:var(--sidebar-text);cursor:pointer;font-size:14px;font-weight:600;
    transition:background .12s;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--accent);color:#fff;}
  .nav-badge{
    background:var(--danger);color:#fff;font-size:11px;font-weight:800;
    min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;
  }
  .sidebar .spacer{flex:1;}
  .sidebar .user-box{
    border-top:1px solid rgba(255,255,255,.08);padding-top:14px;margin-top:8px;
  }
  .sidebar .user-box .uname{font-size:13.5px;font-weight:700;color:#fff;margin-bottom:8px;}
  .main{padding:30px 34px;overflow-y:auto;min-width:0;}
  .main-header{margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .main-header h2{margin:0 0 4px 0;font-size:21px;}
  /* Internal page names are intentionally hidden; Dashboard remains the landing page. */
  .main-header h2{display:none !important;}
  .main-header p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .header-actions{display:flex;gap:8px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
  .card h4{margin:0 0 16px 0;font-size:15px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .row .field{flex:1;min-width:180px;margin-bottom:0;}

  /* ---------- Search box ---------- */
  .search-row{margin-bottom:16px;position:relative;}
  .search-row input{
    width:100%;padding:11px 40px 11px 13px;border:1.5px solid var(--border);border-radius:8px;
    font-family:inherit;font-size:14px;background:#FBFCFD;color:var(--ink);outline:none;
    transition:border-color .15s;
  }
  .search-row input:focus{border-color:var(--accent);}
  .search-row .search-icon{
    position:absolute;top:50%;right:13px;transform:translateY(-50%);
    color:var(--ink-soft);font-size:14px;pointer-events:none;
  }

  /* ---------- Pagination bar ---------- */
  .pager{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
  }
  .pager .pager-info{font-size:12.5px;color:var(--ink-soft);}
  .pager .pager-nav{display:flex;align-items:center;gap:6px;}
  .pager .pager-nav button{
    width:32px;height:32px;border-radius:7px;border:1.5px solid var(--border);background:#fff;
    cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .pager .pager-nav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .pager .pager-nav button:disabled{opacity:.4;cursor:not-allowed;}
  .pager .pager-nav .pager-page{font-size:12.5px;color:var(--ink-soft);padding:0 4px;min-width:70px;text-align:center;}

  table{width:100%;border-collapse:collapse;font-size:13.4px;}
  th,td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--border);}
  th{color:var(--ink-soft);font-weight:700;font-size:12px;}
  tr:last-child td{border-bottom:none;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;
    cursor:default;
  }
  .badge.clickable{cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .badge-pending{background:var(--accent-soft);color:#7a5a17;}
  .badge-process{background:var(--info-soft);color:var(--info);}
  .badge-approved{background:var(--ok-soft);color:var(--ok);}
  .badge-rejected{background:var(--danger-soft);color:var(--danger);}
  .badge-resubmit{background:#EFE3F7;color:#6b3fa0;}
  .badge-deactivated{background:#E7E4E0;color:#5C5347;}
  .badge-enabled{background:var(--ok-soft);color:var(--ok);}
  .badge-disabled{background:var(--danger-soft);color:var(--danger);}
  .empty-state{color:var(--ink-soft);font-size:13.5px;padding:26px 10px;text-align:center;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 22px;border-radius:9px;font-size:13.5px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:999;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .note-text{color:var(--ink-soft);font-size:12.5px;margin:14px 0 0 0;}
  .small-muted{color:var(--ink-soft);font-size:11.5px;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(16,24,38,.55);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:500;
  }
  .modal-card{
    background:#fff;border-radius:14px;padding:26px;max-width:460px;width:100%;
    box-shadow:0 30px 60px rgba(0,0,0,.35);
  }
  .modal-card h3{margin:0 0 14px 0;font-size:16.5px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .modal-close{
    position:absolute;top:14px;left:14px;
  }
  .modal-card{position:relative;}
  .proc-number-box{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:16px;}
  .proc-number-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .proc-number{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:.3px;}
  .proc-bundle-name{font-size:13px;color:var(--ink-soft);margin-top:6px;}

  /* ---------- Top bar with hamburger toggle (shown on every screen size) ---------- */
  .mobile-topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--sidebar);color:#fff;padding:12px 16px;
    position:sticky;top:0;z-index:60;
  }
  .mobile-topbar .mt-title{font-weight:800;font-size:15px;color:#fff;}
  .mobile-topbar .hamburger-btn{
    background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#fff;
    width:38px;height:38px;border-radius:8px;font-size:18px;cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .mobile-topbar .hamburger-btn:hover{border-color:var(--accent);}
  .mobile-topbar .mt-spacer{width:38px;flex:none;}

  /* ---------- Login brand / language / complaint reply ---------- */

  .login-language-wrap{position:absolute;top:18px;right:18px;z-index:20;}
  [dir="rtl"] .login-language-wrap{right:auto;left:18px;}
  .login-language-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.92);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 22px rgba(30,80,160,.12);}
  .login-language-btn .ui-icon{width:20px;height:20px;}
  .login-language-menu{position:absolute;top:48px;right:0;min-width:132px;padding:6px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 35px rgba(20,60,120,.16);display:none;}
  [dir="rtl"] .login-language-menu{right:auto;left:0;}
  .login-language-menu.open{display:block;}
  .login-language-option{display:block;width:100%;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:8px;text-align:center;font-family:inherit;font-weight:700;cursor:pointer;}
  .login-language-option:hover,.login-language-option.active{background:#eef5ff;}
  .roshan-login-slogan{margin-top:8px;font-size:18px;font-weight:900;color:#e11d2e;letter-spacing:.1px;}
  .login-brand{justify-content:center;align-items:center;gap:12px;}
  .login-brand .mark{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(184,134,43,.22);}
  .login-brand .mark .ui-icon{width:31px;height:31px;color:#fff;}
  .login-brand > div:last-child{display:flex;flex-direction:column;gap:2px;}
  .login-brand > div:last-child span{font-size:21px;font-weight:900;}
  .login-brand > div:last-child small{font-size:10px;color:var(--ink-soft);font-weight:700;letter-spacing:.7px;direction:ltr;text-align:right;}
  .mt-language-title{display:flex;align-items:center;gap:8px;padding:9px 12px 5px;font-size:12px;font-weight:800;color:var(--ink-soft);}
  .mt-language-title .ui-icon{width:16px;height:16px;}
  .mt-language-row{display:flex;gap:6px;padding:3px 8px 8px;}
  .mt-language-btn{flex:1;border:1px solid var(--border);background:#f8fafc;color:var(--ink);border-radius:9px;padding:8px 5px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;}
  .mt-language-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .complaint-reply{margin-top:12px;padding:11px 13px;border-radius:12px;background:var(--info-soft);border:1px solid rgba(42,122,160,.14);}
  .complaint-reply-title{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--info);}
  .complaint-reply-title .ui-icon{width:16px;height:16px;}
  .complaint-reply-text{margin-top:6px;font-size:14px;line-height:1.9;}
  .complaint-reply-form{margin-top:12px;display:flex;gap:8px;align-items:flex-end;}
  .complaint-reply-form textarea{flex:1;min-height:42px;}
  @media(max-width:860px){.complaint-reply-form{flex-direction:column;align-items:stretch}.complaint-reply-form .btn{width:100%;}}

  /* ---------- Top-bar user menu ---------- */
  .mt-user-wrap{position:relative;flex:none;display:flex;align-items:center;gap:10px;direction:ltr;}
  .mt-user-btn{
    background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#fff;
    padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;font-family:inherit;max-width:150px;
  }
  .mt-user-btn:hover{border-color:var(--accent);}
  .mt-user-btn .mt-user-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:105px;}
  .mt-user-btn .mt-caret{font-size:10px;color:var(--sidebar-text-dim);flex:none;}
  .mt-user-dropdown.is-hidden{display:none !important;}
  .mt-user-dropdown{
    position:absolute;top:calc(100% + 8px);left:auto;right:0;
    background:#fff;color:var(--ink);border-radius:10px;
    width:230px;min-width:0;max-width:calc(100vw - 24px);
    box-sizing:border-box;
    box-shadow:0 14px 34px rgba(0,0,0,.28);padding:8px;z-index:70;
    display:flex;flex-direction:column;gap:2px;
  }
  .mt-user-item{
    background:transparent;border:none;text-align:right;padding:10px 12px;border-radius:7px;
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
    width:100%;box-sizing:border-box;white-space:normal;overflow-wrap:anywhere;
  }
  .mt-user-item:hover{background:var(--bg);}
  .mt-user-item-danger{color:var(--danger);}
  .mt-user-item-danger:hover{background:var(--danger-soft);}

  /* ---------- Desktop view toggle (forces a permanently-visible wide layout, e.g. on phones) ---------- */
  body.force-desktop .sidebar{
    display:flex !important;
    position:static !important;
    width:236px !important;flex:none !important;flex-direction:column !important;flex-wrap:nowrap !important;
    padding:22px 16px !important;align-items:stretch !important;
    box-shadow:none !important;
  }
  body.force-desktop .shell{display:flex !important;flex-direction:row !important;}
  body.force-desktop .sidebar .brand{display:flex !important;border-bottom:1px solid rgba(255,255,255,.08) !important;margin-bottom:18px !important;padding:0 6px 22px 6px !important;width:auto !important;}
  body.force-desktop .sidebar .role-tag{margin-bottom:18px !important;}
  body.force-desktop .sidebar .spacer{display:block !important;}
  body.force-desktop .sidebar .user-box{border-top:1px solid rgba(255,255,255,.08) !important;padding-top:14px !important;margin-top:8px !important;margin-right:0 !important;}
  body.force-desktop .nav-item{margin-bottom:4px !important;}
  body.force-desktop .main{padding:30px 34px !important;}
  body.force-desktop table{font-size:13.4px !important;}
  body.force-desktop .row{flex-direction:row !important;}
  body.force-desktop .row .field, body.force-desktop .row .btn{width:auto !important;}
  body.force-desktop{min-width:900px;}

  @media (max-width:860px){
    .sidebar{width:100%;left:0;right:0;padding:16px;}
    .main{padding:14px 12px;}
    .grid-2{grid-template-columns:1fr;}
    .card{padding:16px;border-radius:12px;}
    .row{flex-direction:column;align-items:stretch;}
    .row .field{width:100%;min-width:0;}
    .row .btn{width:100%;padding:13px 18px;}
    .pager{flex-direction:column;align-items:stretch;}
    .pager .pager-nav{justify-content:center;}
    .pager .pager-nav button{width:38px;height:38px;}
    .field input, .field textarea, .field select, .search-row input{font-size:16px;padding:12px 14px;}
    .icon-btn{width:40px;height:40px;font-size:18px;}

  function renderPager(containerEl, page, total, onChange){
    if(!containerEl) return;
    if(total<=PAGE_SIZE){ containerEl.innerHTML=''; return; }
    var pageCount = Math.ceil(total/PAGE_SIZE);
    if(page>pageCount-1) page = pageCount-1;
    var startN = total===0 ? 0 : (page*PAGE_SIZE)+1;
    var endN = Math.min(total, (page+1)*PAGE_SIZE);

      '<div class="pager">'+

    });

    return list.filter(function(item){
      return fields.some(function(f){
        var v = item[f];
        return v!=null && String(v).toLowerCase().indexOf(q)!==-1;
      });
    });
  }

    return String(str).replace(/[\u06F0-\u06F9\u0660-\u0669]/g, function(ch){
      var code = ch.charCodeAt(0);
      if(code>=0x06F0 && code<=0x06F9) return String(code-0x06F0); // پښتو/دري ۰-۹
      if(code>=0x0660 && code<=0x0669) return String(code-0x0660); // عربي ٠-٩
      return ch;
    });
  }

    if(saved.buildVersion !== APP_BUILD_VERSION){ clearSavedSession(); return; }

  function ensureSeed(){
    return sGetDoc('users').then(function(res){
      if(!res.ok){
        // The read itself failed (offline/network/permission hiccup) --
        // we do NOT know whether real accounts exist on the server, so we
        // must not seed/overwrite anything here. Bubble this up as a
        // rejection so loadAll() can retry instead of wiping real data.
        return Promise.reject(res.err || new Error('users-read-failed'));
      }
      var users = res.list;
      if(users && users.length){
        state.users = users;
        var legacy = state.users.find(function(u){return u.username==='admin' && u.role==='admin';});
        if(legacy){
          legacy.username = DEFAULT_ADMIN_USER;
          legacy.password = DEFAULT_ADMIN_PASS;
          return persistUsers();
        }
        return;
      }
      // The read succeeded AND the users doc is genuinely empty/missing --
      // this only happens on the very first run, so it's safe to seed.
      var seeded = [{username:DEFAULT_ADMIN_USER, password:DEFAULT_ADMIN_PASS, role:'admin', status:'enabled', createdBy:'system'}];
      state.users = seeded;
      return saveJSON('users', seeded);
    });
  }

  // ---------------- REPAIR/MIGRATION: rebuild sales reports from approved bundles ----------------
  // Older approved bundles were saved in the bundles table but some of them
  // were never added to managerSales/ntoSales. On first load after this build,
  // rebuild both reports from ALL approved bundles exactly once. This also
  // prevents duplicate counting of old approvals. A Firestore transaction is
  // used so a simultaneous approval cannot leave the migration half-applied.
  var SALES_MIGRATION_KEY = 'approved-bundle-sales-v1';
  function migrateApprovedBundleSales(){
    return db.collection('appdata').doc('salesTotals').get().then(function(snap){
      var d = snap.exists ? (snap.data() || {}) : {};
      if(d._migrations && d._migrations[SALES_MIGRATION_KEY]) return;

      return db.runTransaction(function(tx){
        var bundlesRef = db.collection('appdata').doc('bundles');
        var totalsRef = db.collection('appdata').doc('salesTotals');
        return Promise.all([tx.get(bundlesRef), tx.get(totalsRef)]).then(function(reads){
          var bundlesSnap = reads[0];
          var totalsSnap = reads[1];
          var totals = totalsSnap.exists ? (totalsSnap.data() || {}) : {};
          if(totals._migrations && totals._migrations[SALES_MIGRATION_KEY]) return;

          var list = (bundlesSnap.exists && bundlesSnap.data().list) ? bundlesSnap.data().list : [];
          var managerSales = {};
          var ntoSales = {};

          list.forEach(function(b){
            if(!b || b.status!=='approved') return;
            var amt = extractNumber(b.comment);
            var ntoUser = b.ntoUsername;
            var mgrUser = b.actionedBy || findAssignedManager(ntoUser);

            if(ntoUser){
              if(!ntoSales[ntoUser]) ntoSales[ntoUser] = {total:0, count:0};
              ntoSales[ntoUser].total += amt;
              ntoSales[ntoUser].count += 1;
            }
            if(mgrUser){
              if(!managerSales[mgrUser]) managerSales[mgrUser] = {total:0, count:0};
              managerSales[mgrUser].total += amt;
              managerSales[mgrUser].count += 1;
            }
          });

          var migrations = totals._migrations || {};
          migrations[SALES_MIGRATION_KEY] = {completedAt:Date.now(), bundleCount:list.filter(function(b){return b && b.status==='approved';}).length};
          tx.set(totalsRef, {managerSales:managerSales, ntoSales:ntoSales, _migrations:migrations}, {merge:true});
        });
      }).then(function(){
        state.managerSales = {};
        state.ntoSales = {};
        return db.collection('appdata').doc('salesTotals').get();
      }).then(function(snap2){
        if(snap2.exists){
          var d2=snap2.data()||{};
          state.managerSales=d2.managerSales||{};
          state.ntoSales=d2.ntoSales||{};
        }
      });
    });
  }

  function rebuildSalesTotalsOnce(){
    var MIGRATION_VERSION = 4;
    return db.collection('appdata').doc('salesTotals').get().then(function(snap){
      var data=snap.exists?(snap.data()||{}):{};
      if(data.salesRebuildVersion===MIGRATION_VERSION) return;
      var mt={}, nt={};
      state.bundles.forEach(function(b){
        if(b.status!=='approved') return;
        var amt=extractNumber(b.comment||'');
        var n=b.ntoUsername;
        var resetN = (state.salesResetAt && state.salesResetAt.nto && state.salesResetAt.nto[n]) || 0;
        var resetCustomer = (state.customerSalesResetAt && state.customerSalesResetAt[n]) || 0;
        if((resetN && (Number(b.actionedAt)||0) <= Number(resetN)) ||
           (resetCustomer && (Number(b.actionedAt)||0) <= Number(resetCustomer))) return;
        if(n){if(!nt[n])nt[n]={total:0,count:0}; nt[n].total+=amt; nt[n].count++;}
        var m=null;
        if(b.actionedBy){var au=state.users.find(function(u){return u.username===b.actionedBy&&u.role==='manager';}); if(au)m=au.username;}
        if(!m)m=findAssignedManager(n);
        if(!m&&b.processingBy){var pu=state.users.find(function(u){return u.username===b.processingBy&&u.role==='manager';});if(pu)m=pu.username;}
        if(m){
          var resetM = (state.salesResetAt && state.salesResetAt.manager && state.salesResetAt.manager[m]) || 0;
          if(!(resetM && (Number(b.actionedAt)||0) <= Number(resetM))){
            if(!mt[m])mt[m]={total:0,count:0};mt[m].total+=amt;mt[m].count++;
          }
        }
      });
      state.managerSales=mt; state.ntoSales=nt;
      return db.collection('appdata').doc('salesTotals').set({managerSales:mt,ntoSales:nt,salesRebuildVersion:MIGRATION_VERSION},{merge:true});
    });
  }

  // Retries the initial load a few times (with a short delay) before giving
  // up and showing an error screen. This protects against transient
  // network/Firestore hiccups being mistaken for "no data exists yet".
  function loadAll(retriesLeft){
    if(retriesLeft===undefined) retriesLeft = 5;
    return loadAllOnce().then(function(){
      state.loadError = false;
    }).catch(function(err){
      if(retriesLeft<=0){
        state.loadError = true;
        return;
      }
      return new Promise(function(resolve){ setTimeout(resolve, 1500); }).then(function(){
        return loadAll(retriesLeft-1);
      });
    });
  }

  // ---------------- get the most accurate GPS fix available within a time
  // window. A device's very first fix is often a fast but coarse
  // network/Wi-Fi-based estimate (which a VPN's changed IP can throw off);
  // watching for a few seconds and keeping the best (lowest-accuracy-number)
  // reading favours the real satellite GPS fix over that coarse one. ----------------
  function getBestPosition(onDone, maxWaitMs){
    maxWaitMs = maxWaitMs || 9000;
    if(!navigator.geolocation){ onDone(null); return; }
    var best = null, done = false, watchId = null;
    function finish(){
      if(done) return;
      done = true;
      if(watchId!==null && navigator.geolocation.clearWatch){ try{ navigator.geolocation.clearWatch(watchId); }catch(e){} }
      onDone(best);
    }
    try{
      watchId = navigator.geolocation.watchPosition(function(pos){
        if(!best || (pos.coords.accuracy||999999) < (best.coords.accuracy||999999)) best = pos;
        // A reading this precise is a genuine GPS-grade fix -- no need to keep waiting.
        if(pos.coords.accuracy && pos.coords.accuracy <= 30) finish();
      }, function(){ finish(); }, {enableHighAccuracy:true, maximumAge:0, timeout:maxWaitMs});
    }catch(e){ finish(); return; }
    setTimeout(finish, maxWaitMs);
  }

  function requestGeoPermission(){
    if(state.geoRequesting) return;

    getBestPosition(function(pos){

      }else{

      }
      render();
    }, 9000);
  }

  function doLogin(){
    var u = document.getElementById('li-user').value.trim();
    var p = document.getElementById('li-pass').value;
    if(!u || !p){
      state.error = 'مهرباني وکړئ یوزر نوم او پاسورډ دواړه ولیکئ.';
      render(); return;
    }
    var found = state.users.find(function(x){return x.username===u;});
    if(!found || found.password!==p){
      state.error = 'یوزر نوم یا پاسورډ سم نه دی.';
      render(); return;
    }
    if(found.role==='nto' && found.status==='pending_admin'){
      state.error = 'ستاسو مشتری حساب لا د اډمین تایید ته په انتظار کې دی؛ تر تایید مخکې دننه کېدل نشئ کولی.';
      render(); return;
    }
    if(found.role==='nto' && found.status==='rejected_admin'){
      state.error = 'ستاسو حساب د اډمین لخوا رد شوی دی. دلیل: '+(found.adminReviewComment||'دلیل نه دی لیکل شوی.')+' مهرباني وکړئ له خپل مدیر سره اړیکه ونیسئ.';
      render(); return;
    }
    if(found.status==='disabled'){
      state.error = 'دا حساب غیر فعال شوی دی.';
      render(); return;
    }
    state.error='';
    state.currentUser = {username:found.username, role:found.role};
    state.section = null;
    if(found.role==='admin' || found.role==='manager' || found.role==='nto'){
      var tok = uid();
      found.sessionToken = tok;
      state.mySessionToken = tok;
      found.lastLoginAt = Date.now();
      found.onlineStatus = 'online';
      state.myForceLogoutBaseline = found.forceLogoutAt || 0;
      persistUsers();
      recordLoginLocationByIp(found.username);
    }
    saveSession();
    ensureDashboardHistory();
    requestNotificationPermission();
    render();
  }

  // ---------------- best-effort: record a human-readable location for this
  // login. Prefers the device's real GPS position (accurate) and only
  // falls back to IP-based geolocation (city-level, sometimes wrong on
  // mobile networks) if GPS permission isn't granted or isn't available.
  // Never blocks the login flow and fails silently if unavailable. ----------------
  function saveLoginLocation(username, text){
    if(!text) return;
    var u = state.users.find(function(x){return x.username===username;});
    if(!u) return;
    u.lastLoginLocation = text;
    persistUsers().catch(function(){});
  }
  function recordLoginLocationByIp(username){
    fetch('https://ipwho.is/', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
      if(!d || d.success===false) return;
      var parts = [d.city, d.region, d.country].filter(function(p){ return p; });
      if(parts.length) saveLoginLocation(username, parts.join('، '));
    }).catch(function(){ /* ignore -- location is best-effort only */ });
  }
  function reverseGeocodeAndSave(username, lat, lon){
    fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage=en', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d){ recordLoginLocationByIp(username); return; }
        var parts = [d.locality, d.principalSubdivision, d.countryName].filter(function(p){ return p; });
        if(parts.length) saveLoginLocation(username, parts.join('، '));
        else recordLoginLocationByIp(username);
      }).catch(function(){ recordLoginLocationByIp(username); });
  }
  function recordLoginLocation(username){
    // Take a fresh best-effort GPS fix right now (permission is already
    // granted at this point, so this won't prompt again) rather than the
    // earlier fix from the login gate, and only fall back to the coarser
    // IP-based lookup if a real GPS fix can't be obtained.
    getBestPosition(function(pos){
      if(pos) reverseGeocodeAndSave(username, pos.coords.latitude, pos.coords.longitude);
      else recordLoginLocationByIp(username);
    }, 9000);
  }

  function doLogout(){
    var oldUsername = state.currentUser && state.currentUser.username;
    var oldUser = oldUsername ? state.users.find(function(x){return x.username===oldUsername;}) : null;
    // Stop notifications immediately and permanently remove this user's
    // registered push tokens. A browser can keep receiving FCM in the
    // background even after the page itself has been logged out, so simply
    // clearing localStorage is not enough.
    state.notifiedBundleIds = {};
    if(oldUser){ oldUser.fcmTokens = []; oldUser.notificationsEnabled = false; oldUser.onlineStatus = 'offline'; }
    try{
      if(messaging && messaging.deleteToken){ messaging.deleteToken().catch(function(){}); }
    }catch(e){}
    // Remove this username from the server-side FCM registry as well.
    // Without this, an old browser token can still receive background pushes
    // even though the web page itself has been logged out.
    if(oldUsername){ removeNotificationTokensForUser(oldUsername); }
    if(oldUser){ persistUsers().catch(function(){}); }
    state.currentUser = null;
    state.section = null;
    state.modal = null;
    state.userMenuOpen = false;
    state.mySessionToken = null;
    clearSavedSession();
    render();
  }

  // ---------------- admin: force a specific user to log out immediately.
  // The target's browser is listening in real time (see the 'users'
  // onSnapshot handler below) and will detect forceLogoutAt, sign itself
  // out, and do a full page reload -- so the next time that user logs in
  // they're guaranteed to be running whatever is currently deployed. ----------------
  function forceLogoutUser(username){
    var u = state.users.find(function(x){return x.username===username;});
    if(!u) return Promise.resolve();
    u.forceLogoutAt = Date.now();
    u.onlineStatus = 'offline';
    return persistUsers();
  }

  // ---------------- MOBILE/BROWSER BACK -> DASHBOARD ----------------
  // Any browser/Android WebView back action from an internal page returns
  // directly to the dashboard instead of navigating through internal pages.
  var dashboardHistoryReady = false;
  function ensureDashboardHistory(){
    if(dashboardHistoryReady || !window.history || !window.history.replaceState) return;
    try{
      window.history.replaceState({roshanPortal:true, section:'home'}, '', window.location.href);
      dashboardHistoryReady = true;
    }catch(e){}
  }
  window.addEventListener('popstate', function(){
    if(!state.currentUser) return;
    state.section = null;
    state.modal = null;
    state.userMenuOpen = false;
    render();
    ensureDashboardHistory();
  });

  function lookupUITranslation(value, lang){
    var key=String(value==null?'':value).replace(/\u00a0/g,' ').trim();
    if(!key) return null;
    var maps=[STATIC_TRANSLATIONS||{}, (typeof MISSING_UI_TRANSLATIONS!=='undefined'?MISSING_UI_TRANSLATIONS:{}), (window.EN_UI_EXTRA||{}), (window.__ROSHAN_EXTRA_COMPLETE_UI||{})];
    // Direct lookup: the original/source text is normally a Pashto key.
    for(var mi=0;mi<maps.length;mi++){
      var m=maps[mi];
      if(m[key] && m[key][lang]) return m[key][lang];
      if(m[key] && lang==='en' && typeof m[key]==='string') return m[key];
    }
    // Reverse lookup: some UI elements are hard-coded in English/Dari.
    // Resolve those back to their Pashto source first, then translate to the selected language.
    if(lang!=='ps'){
      for(var r=0;r<maps.length;r++){
        var rm=maps[r];
        for(var rk in rm){
          if(!Object.prototype.hasOwnProperty.call(rm,rk)) continue;
          var rv=rm[rk];
          if(rv && typeof rv==='object'){
            if(rv.en===key && rv[lang]) return rv[lang];
            if(rv.fa===key && rv[lang]) return rv[lang];
            if(rv.ps===key && rv[lang]) return rv[lang];
          }
        }
      }
    } else {
      for(var pr=0;pr<maps.length;pr++){
        var pm=maps[pr];
        for(var pk in pm){
          if(!Object.prototype.hasOwnProperty.call(pm,pk)) continue;
          var pv=pm[pk];
          if(pv && typeof pv==='object' && (pv.en===key || pv.fa===key)) return pk;
        }
      }
    }
    return null;
  }

  function addAdminPageExport(headerRow, section){
    if(!headerRow || !state.currentUser || state.currentUser.role!=='admin') return;
    if(headerRow.querySelector('[data-admin-page-export]')) return;
    var wrap = headerRow.querySelector('.header-actions');

    btn.setAttribute('data-admin-page-export','1');

  function exportAdminSection(section){
    var data = [];
    var sheet = section;
    if(section==='managers'){
      data = state.users.filter(function(u){return u.role==='manager';}).map(function(u){
        return {'یوزر-نوم':u.username,'حالت':u.status==='enabled'?'فعال':'غیر فعال'};
      });
      sheet='Managers';
    }else if(section==='ntos'){
      data = state.users.filter(function(u){return u.role==='nto';}).map(function(u){
        return {'یوزر-نوم':u.username,'ادرس':u.address||'','اړیکې شمیره':u.contact||'','جوړونکی':u.createdBy||'','حالت':u.status==='enabled'?'فعال':'غیر فعال'};
      });
      sheet='Customers';
    }else if(section==='rolls'){
      data = state.rolls.map(function(r){ return {'پیغام':r.text,'جوړونکی':r.createdBy||'','نیټه':fmtDate(r.createdAt)}; });
      sheet='Messages';
    }else if(section==='complaints'){
      data = state.complaints.map(function(c){ return {'مشتری':c.fromUsername||'','شکایت':c.text||'','نیټه':fmtDate(c.createdAt)}; });
      sheet='Complaints';
    }else return;
    if(!data.length){ showToast('هیڅ معلومات نشته چې ډاونلوډ شي.'); return; }
    try{
      var ws = XLSX.utils.json_to_sheet(data);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheet);
      XLSX.writeFile(wb, section+'-'+Date.now()+'.xlsx');
    }catch(e){ showToast('د ډاونلوډ کولو کې تېروتنه.'); }
  }

  function renderSection(main){
    var role = state.currentUser.role;
    if(!state.section){
      main.innerHTML = '<div id="sec-body"></div>';
      renderHomeSection(document.getElementById('sec-body'), role);
      return;
    }
    main.innerHTML = '<div class="main-header" id="main-header-row"><div class="section-page-header"><button class="icon-btn dashboard-back-btn" id="dashboard-back-btn" title="ډیشبورډ">'+uiIcon('back')+'</button><h2>'+sectionTitle(state.section)+'</h2></div></div><div id="sec-body"></div>';
    var headerRow = document.getElementById('main-header-row');
    var body = document.getElementById('sec-body');
    var backBtn = document.getElementById('dashboard-back-btn');
    if(backBtn){
      backBtn.onclick = function(){
        state.section = null;
        if(history && history.pushState){
          history.pushState({roshanPortal:true, section:'home'}, '', window.location.href);
        }
        render();
      };
    }

    if(state.section==='bundle' && role==='nto') return renderBundleSection(body);
    if(state.section==='deactivate' && role==='nto') return renderDeactivateSection(body);
    if(state.section==='managers' && role==='admin'){ renderUsersSection(body, 'manager', true, true, role); if(role==='admin') addAdminPageExport(headerRow, 'managers'); return; }
    if(state.section==='ntos' && (role==='admin'||role==='manager')){ renderUsersSection(body, 'nto', role==='admin', role==='admin', role); if(role==='admin') addAdminPageExport(headerRow, 'ntos'); return; }
    if(state.section==='sales') return renderSalesSection(body, role, headerRow);
    if(state.section==='report') return renderReportSection(body, role, headerRow);
    if(state.section==='nto_report' && (role==='admin'||role==='manager')) return renderNtoReportSection(body, headerRow, role);
    if(state.section==='manager_sales' && role==='admin') return renderManagerSalesSection(body, headerRow, role);
    if(state.section==='commission' && role==='admin') return renderCommissionSection(body, headerRow);
    if(state.section==='rolls' && role==='admin'){ renderRollsSection(body); addAdminPageExport(headerRow, 'rolls'); return; }
    if(state.section==='complaints') { renderComplaintsSection(body, role); if(role==='admin') addAdminPageExport(headerRow, 'complaints'); return; }

    body.innerHTML = '<div class="empty-state">لاسرسی نشته.</div>';
  }

  // ---------------- BUNDLE SECTION (NTO only) ----------------
  function renderBundleSection(body){
    var myBundles = state.bundles.filter(function(b){return b.ntoUsername===state.currentUser.username;});
    body.innerHTML =
      '<div class="card">'+
        '<h4>نوی بنډل واستوئ</h4>'+
        '<div class="row">'+
          '<div class="field"><label>شمیره</label><input id="bd-f1" type="text" inputmode="numeric" placeholder="یوازې شمیره" value="'+escapeHtml(state.bundleDraft.field1)+'"></div>'+
          '<div class="field"><label>د بنډل نوم</label><input id="bd-f2" type="text" placeholder="د بنډل نوم ولیکئ" value="'+escapeHtml(state.bundleDraft.field2)+'"></div>'+
          '<button class="btn btn-gold" id="bd-submit">واستوئ</button>'+
        '</div>'+
      '</div>'+
      '<div class="card"><h4>ستاسو د بنډل تاریخچه</h4><div id="bd-list"></div></div>';

    var f1 = document.getElementById('bd-f1');
    var f2 = document.getElementById('bd-f2');
    f1.addEventListener('input', function(){
      var v = normalizeDigits(f1.value).replace(/[^0-9]/g,'');
      v = v.replace(/^0+(?=\d)/,'');
      f1.value = v;
      state.bundleDraft.field1 = v;
    });
    f2.addEventListener('input', function(){
      state.bundleDraft.field2 = f2.value;
    });

    document.getElementById('bd-submit').onclick = function(){
      var btn = document.getElementById('bd-submit');
      var v1 = f1.value.trim();
      var v2 = f2.value.trim();
      if(!v1 || !v2){ showToast('مهرباني وکړئ دواړه خانې ډکې کړئ.'); return; }
      if(btn.disabled) return;

      // The UI is updated immediately. The Firestore transaction runs in the
      // background so a slow network never makes the customer wait.
      var entry = {
        id: uid(),
        ntoUsername: state.currentUser.username,
        field1:v1, field2:v2,
        status:'pending',
        createdAt:Date.now(),
        waitStartAt:Date.now(),
        updatedAt:Date.now(),
        comment:null, actionedBy:null, actionedAt:null, processingBy:null,
        ntoSeen:true
      };

      btn.disabled = true;
      btn.style.opacity = '.6';
      state.bundles.unshift(entry);
      state.bundleDraft = {field1:'', field2:''};
      render();
      showToast('بنډل لېږل کېږي...');

      var bundlesRef = db.collection('appdata').doc('bundles');
      db.runTransaction(function(tx){
        return tx.get(bundlesRef).then(function(snap){
          var current = snap.exists && Array.isArray((snap.data()||{}).list) ? (snap.data()||{}).list : [];
          // Prevent the same generated ID from ever being inserted twice.
          if(!current.some(function(x){return x && x.id===entry.id;})) current.unshift(entry);
          tx.set(bundlesRef, {list:current}, {merge:true});
        });
      }).then(function(){
        showToast('بنډل په بریالیتوب سره واستول شو.');
        state.section='sales';
        renderDashboard(document.getElementById('app'));
      }).catch(function(err){
        console.error(err);
        // Remove only this failed local entry. Never overwrite the server list.
        state.bundles = state.bundles.filter(function(x){return x.id!==entry.id;});
        btn.disabled = false;
        btn.style.opacity = '';
        state.bundleDraft = {field1:v1, field2:v2};
        render();
        showToast('بنډل ونه لېږل شو؛ مهرباني وکړئ بیا هڅه وکړئ.');
      });
    };
    var list = document.getElementById('bd-list');
    if(!myBundles.length){
      list.innerHTML = '<div class="empty-state">تر اوسه هیڅ بنډل نه دی استول شوی.</div>';
    }else{
      list.innerHTML = '<table><thead><tr><th>شمیره</th><th>د بنډل نوم</th><th>حالت</th><th>نیټه</th></tr></thead><tbody>'+
        myBundles.map(function(b){
          return '<tr><td data-label="شمیره">'+escapeHtml(b.field1)+'</td><td data-label="د بنډل نوم">'+escapeHtml(b.field2)+'</td><td data-label="حالت">'+statusBadge(b.status)+'</td><td data-label="نیټه">'+fmtDateHtml(b.createdAt)+'</td></tr>';
        }).join('')+
      '</tbody></table>';
    }
  }

      };

  function renderSalesSection(body, role, headerRow){
    if(role==='manager') scheduleAssignWindowRefresh();
    var allRows = role==='nto' ? state.bundles.filter(function(b){return b.ntoUsername===state.currentUser.username;}) : state.bundles.slice();
    if(role==='manager'){
      // A bundle that's still within its assignment window and belongs to a
      // different manager's customer is completely hidden from this
      // manager's bundle page -- not just non-clickable -- until the window
      // elapses or it becomes theirs. Everything else (already
      // approved/rejected/etc., or unassigned customers) stays visible.
      allRows = allRows.filter(function(b){
        if(b.status==='approved' || b.status==='rejected' || b.status==='deactivated') return true;
        return isBundleClaimableByManager(b, state.currentUser.username);
      });
    }
    var bundleQ = (state.bundleSearch||'').trim().toLowerCase();
    var rows = !bundleQ ? allRows : allRows.filter(function(b){
      return String(b.ntoUsername||'').toLowerCase().indexOf(bundleQ)!==-1 ||
             String(b.field1||'').toLowerCase().indexOf(bundleQ)!==-1 ||
             String(b.status||'').toLowerCase().indexOf(bundleQ)!==-1 ||
             String(statusLabel(b.status)||'').toLowerCase().indexOf(bundleQ)!==-1;
    });
    // Resubmitted bundles are pinned to the very top of the list for every
    // role (admin/manager/nto), most-recently-resubmitted first. Everything
    // else keeps its existing relative order (Array#sort is stable).
    rows = rows.slice().sort(function(a,b){
      var ar = a.status==='resubmit' ? 1 : 0;
      var br = b.status==='resubmit' ? 1 : 0;
      if(ar!==br) return br-ar;
      if(ar===1 && br===1) return (b.waitStartAt||b.createdAt||0) - (a.waitStartAt||a.createdAt||0);
      return 0;
    });
    var canProcess = (role==='admin' || role==='manager');

          o['نیټه'] = fmtDate(b.createdAt);
          return o;
        });
        try{
          var ws = XLSX.utils.json_to_sheet(data);
          var wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'SalesReport');
          XLSX.writeFile(wb, 'sales-report-'+Date.now()+'.xlsx');
        }catch(e){ showToast('د ډاونلوډ کولو کې تېروتنه.'); }

      if(role==='admin'){
        document.getElementById('sales-reset').onclick = function(){
          showRoshanConfirm('آیا ډاډه یاست چې غواړئ د بنډلونو ټوله جدول (لیست) ړنګ کړئ؟ د مدیرانو او مشتریانو د فروشاتو ټوله شمیرې به اغیزمنې نشي، یوازې دا جدول به پاک شي. دا کار بیرته نشي کیدلی.', function(ok){
          if(!ok) return;
          // یوازې د بنډلونو لیست پاکېږي؛ موجود د مدیرانو/مشتریانو فروشات
          // باید هماغسې پاتې شي او د reset له امله rebuild/zero نه شي.
          state.bundles = [];
          persistBundles().then(function(){
            showToast('ټول د بنډل معلومات پاک شول؛ د فروشاتو راپورونه هماغسې پاتې شول.');
            renderDashboard(document.getElementById('app'));
          });
          });
        };
      }
    }

    if(!allRows.length){
      body.innerHTML = '<div class="card"><div class="empty-state">هیڅ ثبت شوی معلومات نشته.</div></div>';

  function copyToClipboard(text){
    var done = function(){ showToast('شمیره کاپي شوه.'); };
    var fail = function(){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }catch(e){ showToast('کاپي نشو کیدلی.'); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(fail);
    }else{
      fail();
    }
  }

  // Masks everything except the last 3 characters of a number with '***'
  // (used to hide a customer's number from a manager until it's approved).
  function maskLast3Digits(str){
    str = String(str==null?'':str);
    if(str.length<=3) return '***';
    return escapeHtml(str.slice(0,-3))+'***';
  }

  // ---------------- ADMIN: delete a single bundle everywhere ----------------
  // Asks for confirmation, then removes just this one bundle from the shared
  // bundles table -- since every role reads the same table, this removes it
  // for all users (admin/manager/nto) at once.
  function deleteBundleById(bundleId){
    var b = state.bundles.find(function(x){return x.id===bundleId;});
    if(!b) return;
    showRoshanConfirm('آیا تاسو ډاډه یاست چې غواړئ دا بنډل ړنګ کړئ؟ دا کار به دا بنډل د ټولو یوزرانو لپاره ړنګ کړي او بیرته نشي کیدلی.', function(ok){
    if(!ok) return;

    var amount = (b.status==='approved') ? extractNumber(b.comment||'') : 0;
    var customer = b.ntoUsername;
    var manager = b.actionedBy;
    if(!manager || !state.users.some(function(u){return u.username===manager && u.role==='manager';})){
      manager = findAssignedManager(customer);
    }

    var bundlesRef = db.collection('appdata').doc('bundles');
    var totalsRef = db.collection('appdata').doc('salesTotals');

    // Delete the bundle and remove its approved amount from BOTH reports in
    // the same Firestore transaction. This prevents another snapshot/client
    // from restoring the customer's sales after the manager sales were changed.
    db.runTransaction(function(tx){
      return Promise.all([tx.get(bundlesRef), tx.get(totalsRef)]).then(function(reads){
        var bundleSnap=reads[0], totalsSnap=reads[1];
        var list=(bundleSnap.exists && bundleSnap.data().list) ? bundleSnap.data().list.slice() : [];
        var current=list.find(function(x){return x.id===bundleId;});
        if(!current) return;

        var totals=totalsSnap.exists ? (totalsSnap.data()||{}) : {};
        var managerSales=totals.managerSales || {};
        var ntoSales=totals.ntoSales || {};

        if(current.status==='approved'){
          var amt=extractNumber(current.comment||'');
          var cu=current.ntoUsername;
          var mg=current.actionedBy;
          if(!mg || !state.users.some(function(u){return u.username===mg && u.role==='manager';})) mg=findAssignedManager(cu);

          // Customer report: remove exactly this deleted bundle's amount/count.
          if(cu && ntoSales[cu]){
            ntoSales[cu]={
              total:Math.max(0,(Number(ntoSales[cu].total)||0)-amt),
              count:Math.max(0,(Number(ntoSales[cu].count)||0)-1)
            };
          }
          // Manager report: remove exactly this deleted bundle's amount/count.
          if(mg && managerSales[mg]){
            managerSales[mg]={
              total:Math.max(0,(Number(managerSales[mg].total)||0)-amt),
              count:Math.max(0,(Number(managerSales[mg].count)||0)-1)
            };
          }
        }

        list=list.filter(function(x){return x.id!==bundleId;});
        tx.set(bundlesRef,{list:list},{merge:true});
        tx.set(totalsRef,{
          managerSales:managerSales,
          ntoSales:ntoSales,
          lastRebuildAt:Date.now()
        },{merge:true});
      });
    }).then(function(){
      state.bundles=state.bundles.filter(function(x){return x.id!==bundleId;});
      if(amount>0){
        if(customer && state.ntoSales[customer]){
          state.ntoSales[customer]={total:Math.max(0,(Number(state.ntoSales[customer].total)||0)-amount),count:Math.max(0,(Number(state.ntoSales[customer].count)||0)-1)};
        }
        if(manager && state.managerSales[manager]){
          state.managerSales[manager]={total:Math.max(0,(Number(state.managerSales[manager].total)||0)-amount),count:Math.max(0,(Number(state.managerSales[manager].count)||0)-1)};
        }
      }
      showToast('بنډل ړنګ شو او د مدیر او مشتری دواړو فروشات تازه شول.');
      renderDashboard(document.getElementById('app'));
    }).catch(function(err){
      console.error(err);
      showToast('د بنډل د ړنګولو پر مهال ستونزه وشوه.');
      renderDashboard(document.getElementById('app'));
    });
    });
  }

  function badgeClass(status){
    if(status==='pending' || status==='pending_admin') return 'badge-pending';
    if(status==='in_process') return 'badge-process';
    if(status==='approved') return 'badge-approved';
    if(status==='rejected' || status==='rejected_admin') return 'badge-rejected';
    if(status==='resubmit') return 'badge-resubmit';
    if(status==='deactivated') return 'badge-deactivated';
    if(status==='enabled') return 'badge-enabled';
    if(status==='disabled') return 'badge-disabled';
    if(status==='pending_admin') return 'badge-pending';
    if(status==='rejected_admin') return 'badge-rejected';
    if(status==='online') return 'badge-enabled';
    if(status==='offline') return 'badge-disabled';
    return '';
  }
  function statusLabel(status){
    if(status==='pending') return 'انتظار حالت کې';
    if(status==='in_process') return 'تر جريان لاندې شو';
    if(status==='approved') return 'فعاله شوو';
    if(status==='rejected') return 'رد شوى دى';
    if(status==='pending_admin') return 'د اډمین تایید ته انتظار';
    if(status==='rejected_admin') return 'د اډمین لخوا رد شوی';
    if(status==='resubmit') return 'بیا استول شوى';
    if(status==='deactivated') return 'غیري فعاله شو';
    if(status==='enabled') return 'فعاله';
    if(status==='disabled') return 'غیر فعاله';
    if(status==='pending_admin') return 'د اډمین تایید ته انتظار';
    if(status==='rejected_admin') return 'د اډمین لخوا رد شوی';

  function statusBadge(status){

  function onlineDot(onlineStatus){

    return '<span title="'+(isOnline?'انلاین':'آفلاین')+'" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+(isOnline?'#2E7D5B':'#B3432B')+';"></span>';

  // ---------------- MANAGER ASSIGNMENT WINDOW (problem #4) ----------------
  // The manager who created a customer's account is that customer's "own"
  // manager. When the customer sends a fresh bundle (or resubmits one), it
  // is reserved for that manager for ASSIGN_WAIT_MS. If the assigned
  // manager hasn't acted on it by then, it opens up to every manager.
  function findAssignedManager(ntoUsername){
    var ntoUser = state.users.find(function(u){ return u.username===ntoUsername && u.role==='nto'; });
    if(!ntoUser || !ntoUser.createdBy) return null;
    var creator = state.users.find(function(u){ return u.username===ntoUser.createdBy && u.role==='manager'; });
    return creator ? creator.username : null;
  }
  function isBundleClaimableByManager(b, managerUsername){
    // Approved/rejected/deactivated bundles are already decided -- no more
    // contention over who may act on them, so always visible/claimable.
    if(b.status==='approved' || b.status==='rejected' || b.status==='deactivated') return true;
    var assignedMgr = findAssignedManager(b.ntoUsername);
    if(!assignedMgr) return true; // customer has no owning manager (e.g. created by admin) -- open to all immediately
    var startedAt = b.waitStartAt || b.createdAt || 0;
    if(Date.now() - startedAt >= ASSIGN_WAIT_MS) return true; // window elapsed -- open to all managers
    return managerUsername === assignedMgr;
  }
  // Schedules a single re-render once the soonest pending assignment window
  // in state.bundles elapses, so the UI/notifications update on their own
  // instead of requiring a manual refresh.
  function scheduleAssignWindowRefresh(){
    if(state.assignTimer){ clearTimeout(state.assignTimer); state.assignTimer=null; }
    if(!state.currentUser || state.currentUser.role!=='manager') return;
    var now = Date.now();
    var soonest = null;
    state.bundles.forEach(function(b){
      if(b.status==='approved' || b.status==='rejected' || b.status==='deactivated') return;
      if(isBundleClaimableByManager(b, state.currentUser.username)) return;
      var startedAt = b.waitStartAt || b.createdAt || 0;
      var remaining = (startedAt + ASSIGN_WAIT_MS) - now;
      if(remaining>0 && (soonest===null || remaining<soonest)) soonest = remaining;
    });
    if(soonest!==null){
      state.assignTimer = setTimeout(function(){
        state.assignTimer = null;
        checkForManagerEscalations();
        render();
      }, soonest+250);
    }
  }

  // ---------------- PROCESS MODAL (admin/manager: approve/reject) ----------------
  function openProcessModal(bundleId){
    var b = state.bundles.find(function(x){return x.id===bundleId;});
    if(!b) return;
    if(b.status!=='pending' && b.status!=='resubmit' && b.status!=='in_process') return;
    if(state.currentUser.role==='manager' && b.status==='in_process'){
      showToast('دا بنډل اوس د '+(b.processingBy||'بل مدیر')+' تر پروسس لاندې دی.');
      return;
    }
    if(state.currentUser.role==='manager' && (b.status==='pending'||b.status==='resubmit') && !isBundleClaimableByManager(b, state.currentUser.username)){
      var ownMgr = findAssignedManager(b.ntoUsername);
      showToast('دا بنډل لومړی د '+ownMgr+' لپاره خوندي دی، مهرباني وکړئ لږ صبر وکړئ.');
      return;
    }

    var previousStatus = b.status==='in_process' ? (b.prevStatusBeforeProcess||'pending') : b.status;
    // A local lock stops double-clicks, while the Firestore transaction below
    // is the authoritative claim. No whole bundle array is ever written here.
    if(state.pendingBundleClaims && state.pendingBundleClaims[bundleId]) return;
    if(!state.pendingBundleClaims) state.pendingBundleClaims={};
    state.pendingBundleClaims[bundleId]=true;

    // Open immediately so the manager can enter the comment without waiting.
    b.prevStatusBeforeProcess = previousStatus;
    b.status = 'in_process';
    b.processingBy = state.currentUser.username;
    state.modal = b.type==='deactivate'
      ? {type:'deactivate-confirm', bundleId:bundleId, previousStatus:previousStatus}
      : {type:'process', bundleId:bundleId, previousStatus:previousStatus, draftComment:''};
    render();

    var bundlesRef=db.collection('appdata').doc('bundles');
    db.runTransaction(function(tx){
      return tx.get(bundlesRef).then(function(snap){
        var list=snap.exists && Array.isArray((snap.data()||{}).list) ? (snap.data()||{}).list : [];
        if(state.pendingBundleDecisions && state.pendingBundleDecisions[bundleId]) throw new Error('decision-in-progress');
        var live=list.find(function(x){return x && x.id===bundleId;});
        if(!live) throw new Error('bundle-not-found');
        if(live.status==='in_process' && live.processingBy && live.processingBy!==state.currentUser.username){ throw new Error('bundle-busy'); }
        if(live.status!=='pending' && live.status!=='resubmit' && live.status!=='in_process') throw new Error('bundle-already-decided');
        var prev=live.status==='in_process' ? (live.prevStatusBeforeProcess||previousStatus) : live.status;
        live.prevStatusBeforeProcess=prev;
        live.status='in_process';
        live.processingBy=state.currentUser.username;
        live.updatedAt=Date.now();
        tx.set(bundlesRef,{list:list},{merge:true});
      });
    }).catch(function(err){
      console.error(err);
      var live=state.bundles.find(function(x){return x.id===bundleId;});
      if(live){live.status=previousStatus;live.processingBy=null;live.prevStatusBeforeProcess=null;}
      if(state.modal && state.modal.bundleId===bundleId) state.modal=null;
      showToast(err && err.message==='bundle-busy' ? 'دا بنډل اوس د بل مدیر تر پروسس لاندې دی.' : 'د بنډل حالت ثبت نه شو، مهرباني وکړئ بیا هڅه وکړئ.');
      render();
    }).finally(function(){ delete state.pendingBundleClaims[bundleId]; });
  }

  function closeProcessModal(){

    var bundleId=modal.bundleId;
    state.modal=null;
    render();

    // Revert only our own claim. This is a per-bundle transaction, so it can
    // never write an old copy of another bundle back to Firestore.
    var bundlesRef=db.collection('appdata').doc('bundles');
    db.runTransaction(function(tx){
      return tx.get(bundlesRef).then(function(snap){
        var list=snap.exists && Array.isArray((snap.data()||{}).list) ? (snap.data()||{}).list : [];
        var live=list.find(function(x){return x && x.id===bundleId;});
        if(live && live.status==='in_process' && live.processingBy===state.currentUser.username){
          live.status=modal.previousStatus||live.prevStatusBeforeProcess||'pending';
          live.processingBy=null;
          live.prevStatusBeforeProcess=null;
          live.updatedAt=Date.now();
          tx.set(bundlesRef,{list:list},{merge:true});
        }
      });
    }).catch(function(err){console.error(err);});
  }

  function submitProcessDecision(decision, overrideComment){
    if(!state.modal) return;
    var modal=state.modal;
    var bundleId=modal.bundleId;
    var commentEl=document.getElementById('proc-comment');
    var comment=(overrideComment!=null)?overrideComment:(commentEl?commentEl.value.trim():'');
    if(!comment){showToast('مهرباني وکړئ لومړی کمینټ ولیکئ.');return;}

    if(!state.pendingBundleDecisions) state.pendingBundleDecisions={};
    if(state.pendingBundleDecisions[bundleId]) return;
    state.pendingBundleDecisions[bundleId]=true;

    var actor=state.currentUser.username;
    var actionAt=Date.now();
    var approvalId=uid();
    var amount=extractNumber(comment);
    var local=state.bundles.find(function(x){return x.id===bundleId;});
    if(!local){
      delete state.pendingBundleDecisions[bundleId];
      return;
    }

    // Keep a small snapshot so a failed server write can be rolled back safely.
    var before={
      status:local.status, comment:local.comment, actionedBy:local.actionedBy,
      actionedAt:local.actionedAt, processingBy:local.processingBy,
      prevStatusBeforeProcess:local.prevStatusBeforeProcess, ntoSeen:local.ntoSeen,
      updatedAt:local.updatedAt, approvalId:local.approvalId, approvedAt:local.approvedAt,
      approvedBy:local.approvedBy, salesAmount:local.salesAmount, salesLedgerKey:local.salesLedgerKey
    };

    // Optimistic UI: close the modal and update this bundle immediately.
    // Firestore remains authoritative in the background.
    local.status=decision;
    local.comment=comment;
    local.actionedBy=actor;
    local.actionedAt=actionAt;
    local.processingBy=null;
    local.prevStatusBeforeProcess=null;
    local.ntoSeen=false;
    local.updatedAt=actionAt;
    if(decision==='approved'){
      local.approvalId=approvalId;
      local.approvedAt=actionAt;
      local.approvedBy=actor;
      local.salesAmount=amount;
      local.salesLedgerKey=bundleId+'|'+approvalId+'|'+actionAt;
    }
    state.modal=null;
    render();
    showToast(decision==='approved'?'بنډل فعاله شو؛ معلومات ثبتېږي...':'بنډل رد شو؛ معلومات ثبتېږي...');

    var bundlesRef=db.collection('appdata').doc('bundles');
    var totalsRef=db.collection('appdata').doc('salesTotals');

    db.runTransaction(function(tx){
      return Promise.all([tx.get(bundlesRef),tx.get(totalsRef)]).then(function(reads){
        var bSnap=reads[0], tSnap=reads[1];
        var list=bSnap.exists && Array.isArray((bSnap.data()||{}).list)?(bSnap.data()||{}).list:[];
        var live=list.find(function(x){return x&&x.id===bundleId;});
        if(!live) throw new Error('bundle-not-found');

        if(live.status==='in_process'){
          if(live.processingBy!==actor) throw new Error('bundle-busy');
        }else if(live.status!=='pending' && live.status!=='resubmit'){
          throw new Error('bundle-already-decided');
        }

        var approvedManager=null;
        if(decision==='approved'){
          if(state.currentUser.role==='manager') approvedManager=actor;
          if(!approvedManager && live.processingBy){
            var pm=state.users.find(function(u){return u.username===live.processingBy&&u.role==='manager';});
            if(pm) approvedManager=pm.username;
          }
          if(!approvedManager) approvedManager=findAssignedManager(live.ntoUsername);
          if(!approvedManager) throw new Error('manager-not-found');
        }

        live.status=decision;
        live.comment=comment;
        live.actionedBy=actor;
        live.actionedAt=actionAt;
        live.processingBy=null;
        live.prevStatusBeforeProcess=null;
        live.ntoSeen=false;
        live.updatedAt=actionAt;

        if(decision==='approved'){
          live.approvalId=approvalId;
          live.approvedAt=actionAt;
          live.approvedBy=actor;
          live.salesAmount=amount;
          live.salesLedgerKey=bundleId+'|'+approvalId+'|'+actionAt;
        }

        tx.set(bundlesRef,{list:list},{merge:true});

        if(decision==='approved'){
          var totals=tSnap.exists?(tSnap.data()||{}):{};
          var managerSales=totals.managerSales||{};
          var ntoSales=totals.ntoSales||{};
          var ledger=totals.salesLedger||{};
          var ledgerKey=live.salesLedgerKey;

          if(!ledger[ledgerKey]){
            if(!managerSales[approvedManager]) managerSales[approvedManager]={total:0,count:0};
            managerSales[approvedManager]={
              total:(Number(managerSales[approvedManager].total)||0)+amount,
              count:(Number(managerSales[approvedManager].count)||0)+1
            };
            if(live.ntoUsername){
              if(!ntoSales[live.ntoUsername]) ntoSales[live.ntoUsername]={total:0,count:0};
              ntoSales[live.ntoUsername]={
                total:(Number(ntoSales[live.ntoUsername].total)||0)+amount,
                count:(Number(ntoSales[live.ntoUsername].count)||0)+1
              };
            }
            ledger[ledgerKey]={
              bundleId:bundleId,amount:amount,manager:approvedManager,
              ntoUsername:live.ntoUsername||null,approvedAt:actionAt,approvalId:approvalId
            };
            tx.set(totalsRef,{
              managerSales:managerSales,ntoSales:ntoSales,
              salesLedger:ledger,lastApprovalAt:actionAt
            },{merge:true});
          }
        }
      });
    }).then(function(){
      showToast(decision==='approved'?'بنډل فعاله شو او فروشات ثبت شول.':'بنډل رد شو.');
      render();
    }).catch(function(err){
      console.error(err);
      var cur=state.bundles.find(function(x){return x.id===bundleId;});
      // Roll back only if this client still owns the optimistic version.
      if(cur && cur.actionedAt===actionAt && cur.actionedBy===actor){
        Object.keys(before).forEach(function(k){cur[k]=before[k];});
      }
      showToast(err&&err.message==='bundle-busy'?'دا بنډل اوس د بل مدیر تر پروسس لاندې دی.':err&&err.message==='bundle-already-decided'?'دا بنډل مخکې لا فیصله شوی دی.':'د بنډل د ثبت پر مهال تېروتنه وشوه، بیا هڅه وکړئ.');
      render();
    }).finally(function(){
      delete state.pendingBundleDecisions[bundleId];
    });
  }

  function submitResubmit(){
    if(!state.modal) return;
    var commentEl = document.getElementById('resub-comment');
    var comment = commentEl ? commentEl.value.trim() : '';
    if(!comment){ showToast('مهرباني وکړئ کمینټ ولیکئ.'); return; }
    var modal = state.modal;
    var bundleId = modal.bundleId;
    var b = state.bundles.find(function(x){return x.id===bundleId;});
    if(!b) return;
    if(state.pendingBundleDecisions && state.pendingBundleDecisions[bundleId]) return;
    if(!state.pendingBundleDecisions) state.pendingBundleDecisions={};
    state.pendingBundleDecisions[bundleId]=true;

    var now = Date.now();
    var ntoUser = state.currentUser.username;
    var oldStatus = b.status;
    // Update the customer screen immediately. The database write continues in
    // the background, so the customer does not wait for Firestore latency.
    b.status='resubmit';
    b.comment=comment;
    b.actionedBy=null;
    b.actionedAt=null;
    b.processingBy=null;
    b.prevStatusBeforeProcess=null;
    b.ntoSeen=true;
    b.waitStartAt=now;
    b.updatedAt=now;
    state.modal=null;
    render();
    showToast('بنډل بیا لېږل کېږي...');

    var bundlesRef=db.collection('appdata').doc('bundles');
    db.runTransaction(function(tx){
      return tx.get(bundlesRef).then(function(snap){
        var list=snap.exists && Array.isArray((snap.data()||{}).list)?(snap.data()||{}).list:[];
        var live=list.find(function(x){return x&&x.id===bundleId;});
        if(!live) throw new Error('bundle-not-found');
        if(live.status!=='rejected') throw new Error('bundle-already-changed');
        live.status='resubmit';
        live.comment=comment;
        live.actionedBy=null;
        live.actionedAt=null;
        live.processingBy=null;
        live.prevStatusBeforeProcess=null;
        live.ntoSeen=true;
        live.waitStartAt=now;
        live.updatedAt=now;
        tx.set(bundlesRef,{list:list},{merge:true});
      });
    }).then(function(){
      showToast('بنډل بیا وړاندې شو.');
    }).catch(function(err){
      console.error(err);
      var live=state.bundles.find(function(x){return x.id===bundleId;});
      if(live){
        live.status=oldStatus;
        live.comment=comment;
        live.actionedBy=null;
        live.actionedAt=null;
        live.processingBy=null;
        live.prevStatusBeforeProcess=null;
        live.ntoSeen=false;
      }
      showToast('بنډل بیا ونه لېږل شو؛ مهرباني وکړئ بیا هڅه وکړئ.');
      render();
    }).finally(function(){delete state.pendingBundleDecisions[bundleId];});
  }

                if(!key)return;
                if(!map[key])map[key]={total:0,count:0};
                map[key].total=(Number(map[key].total)||0)+amount;

                if(map[key].total<0)map[key].total=0;

  // ---------------- USERS SECTIONS (managers / ntos) ----------------
  function renderUsersSection(body, targetRole, canToggle, canDelete, viewerRole){
    // Managers only see the customer accounts THEY created; other managers'
    // customers stay hidden from them. Admin still sees everyone.

  // ---------------- SALES FOR OTHER MANAGERS' CUSTOMERS ----------------
  // Shows approved bundles where a manager processed a customer who belongs
  // to a different manager. For a manager, only that manager's own actions
  // are shown; Admin sees the combined report grouped by customer owner.
  function getOtherManagerSalesRows(viewerRole, viewerUsername){
    var grouped = {};
    var resetMap = state.otherManagerSalesResetAt || {};
    state.bundles.forEach(function(b){
      if(!b || b.status!=='approved') return;
      var owner = findAssignedManager(b.ntoUsername);
      var actor = b.actionedBy;
      if(!owner || !actor || owner===actor) return;
      if(!state.users.some(function(u){return u.username===actor && u.role==='manager';})) return;
      if(viewerRole==='manager' && actor!==viewerUsername) return;
      var resetAt=Number(resetMap[owner]||0), actionedAt=Number(b.actionedAt)||0;
      if(resetAt && actionedAt<=resetAt) return;
      if(!grouped[actor]) grouped[actor]={};
      if(!grouped[actor][owner]) grouped[actor][owner]={total:0,count:0};
      grouped[actor][owner].total += extractNumber(b.comment||'');
      grouped[actor][owner].count += 1;
    });
    return Object.keys(grouped).sort().map(function(actor){
      return {actor:actor, rows:Object.keys(grouped[actor]).sort().map(function(owner){
        return {username:owner,count:grouped[actor][owner].count,total:grouped[actor][owner].total};
      })};
    });
  }

  function exportOtherManagerSales(groups){
    var data=[];
    groups.forEach(function(g){
      g.rows.forEach(function(r){ data.push({'فعال کوونکی مدير':g.actor,'مدير':r.username,'د فعاله شويو بنډلونو شمير':r.count,'فروشات':r.total}); });
    });
    if(!data.length){ showToast('هیڅ د نورو مدیرانو فروشات نشته چې ډاونلوډ شي.'); return; }
    try{var ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'ManagerSales');XLSX.writeFile(wb,'manager-sales-'+Date.now()+'.xlsx');}catch(e){showToast('د ډانلوډ کولو کې تېروتنه.');}
  }

    Array.prototype.forEach.call(document.querySelectorAll('[data-other-mgr-reset]'),function(btn){btn.onclick=function(){
      var mgr=btn.getAttribute('data-other-mgr-reset');showRoshanConfirm('آیا ډاډه یاست چې غواړئ د '+mgr+' د نورو مدیرانو فروشاتو راپور صفر کړئ؟', function(ok){if(!ok)return;
      if(!state.otherManagerSalesResetAt)state.otherManagerSalesResetAt={};state.otherManagerSalesResetAt[mgr]=Date.now();
      db.collection('appdata').doc('salesTotals').set({otherManagerSalesResetAt:state.otherManagerSalesResetAt},{merge:true}).then(function(){showToast('د '+mgr+' د مدیرانو فروشات راپور صفر شو.');render();}).catch(function(){showToast('د راپور د ریسیټ پر مهال تېروتنه وشوه.');});

  // ---------------- REPORT SECTION ----------------
  function extractNumber(str){
    if(!str) return 0;
    var normalized = normalizeDigits(str);
    // Strip thousands-separator commas (e.g. "1,500") so amounts typed with
    // commas are still picked up as a single number instead of just "1".
    var cleaned = normalized.replace(/(\d),(?=\d{3}(\D|$))/g, '$1');
    var m = cleaned.match(/\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : 0;
  }
  function dateKeyOf(ts){
    var d = new Date(ts);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function managerStats(managerUsername){
    var s = state.managerSales[managerUsername];
    return s ? {total:s.total, count:s.count} : {total:0, count:0};
  }

  function ntoStats(ntoUsername){
    var s = state.ntoSales[ntoUsername];
    return s ? {total:s.total, count:s.count} : {total:0, count:0};
  }

  // ---------------- ADMIN: PER-NTO REPORT ----------------
  function renderNtoReportSection(body, headerRow, role){
    role = role || 'admin';
    // Manager only sees the customers assigned/created by this manager.
    // Admin continues to see all customers.
    var ntoUsers = state.users.filter(function(u){
      if(u.role!=='nto') return false;
      if(role==='manager'){
        return String(u.createdBy || '') === String(state.currentUser.username || '');
      }
      return true;
    });

    if(headerRow){
      headerRow.innerHTML =
        '<div><h2>'+sectionTitle('nto_report')+'</h2></div>'+
        '<div class="header-actions">'+
          '<button class="icon-btn" id="nto-report-export" title="اکسیل ډاونلوډ">'+uiIcon('download')+'</button>'+
        '</div>';
      document.getElementById('nto-report-export').onclick = function(){
        if(!ntoUsers.length){ showToast('هیڅ معلومات نشته چې ډاونلوډ شي.'); return; }
        var data = ntoUsers.map(function(u){
          var s = ntoStats(u.username);
          var o = {};
          o['مشتری'] = u.username;
          o['فعاله شويو بنډلونو شمير'] = s.count;
          o['فروشات'] = s.total;
          var rate = Number(state.commissionRate);
          if(!isFinite(rate) || rate < 0) rate = 3;
          o['کمیسیون'] = (Number(s.total)||0) * rate / 100;
          return o;
        });
        try{
          var ws = XLSX.utils.json_to_sheet(data);
          var wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'NtoReport');
          XLSX.writeFile(wb, 'nto-report-'+Date.now()+'.xlsx');
        }catch(e){ showToast('د ډاونلوډ کولو کې تېروتنه.'); }
      };
    }

    if(!ntoUsers.length){
      body.innerHTML = '<div class="card"><div class="empty-state">تر اوسه هیڅ مشتری حساب نشته.</div></div>';
      return;
    }
    var commissionRate = Number(state.commissionRate);
    if(!isFinite(commissionRate) || commissionRate < 0) commissionRate = 3;
    var rows = ntoUsers.map(function(u){
      var s = ntoStats(u.username);
      var commission = (Number(s.total)||0) * commissionRate / 100;
      return {username:u.username, count:s.count, total:s.total, commission:commission};
    });
    rows = filterBySearch(rows, state.ntoReportSearch, ['username']);
    var ntoReportSearchPlaceholder = state.language==='en' ? 'Search customer name...' : (state.language==='fa' ? 'جستجوی نام مشتری...' : 'د مشتری نوم ولټوئ...');
    var ntoReportSearchHtml = '<div class="search-row"><input id="nto-report-search" type="text" placeholder="'+escapeHtml(ntoReportSearchPlaceholder)+'" value="'+escapeHtml(state.ntoReportSearch||'')+'"><span class="search-icon">'+uiIcon('search')+'</span></div>';

  // ---------------- COMPLAINTS ----------------
  function replyToComplaint(complaintId, replyText){
    replyText = String(replyText||'').trim();
    if(!replyText) return Promise.reject(new Error('empty-reply'));
    var complaintsRef = db.collection('appdata').doc('complaints');
    var adminUsername = state.currentUser && state.currentUser.username;
    return db.runTransaction(function(tx){
      return tx.get(complaintsRef).then(function(snap){
        var list = snap.exists && Array.isArray((snap.data()||{}).list) ? (snap.data()||{}).list.slice() : [];
        var idx = list.findIndex(function(c){return c && c.id===complaintId;});
        if(idx<0) throw new Error('complaint-not-found');
        var c = Object.assign({}, list[idx]);
        c.reply = replyText;
        c.replyBy = adminUsername || '';
        c.replyAt = Date.now();
        list[idx] = c;
        tx.set(complaintsRef, {list:list}, {merge:true});
      });
    }).then(function(){
      var local = state.complaints.find(function(c){return c.id===complaintId;});
      if(local){
        local.reply=replyText;
        local.replyBy=adminUsername||'';
        local.replyAt=Date.now();
      }
      showToast(t('replySent','ریپلي واستول شو.'));
      renderSection(document.getElementById('main-area'));
    });
  }
