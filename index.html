  // ---------------- utils ----------------
  function fmtDate(ts){
    var d = new Date(ts);
    return d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:true});
  }
  // Same as fmtDate but forces left-to-right rendering so the date/time
  // order doesn't get flipped by the page's RTL text direction.
  function fmtDateHtml(ts){
    return '<span dir="ltr" style="unicode-bidi:isolate">'+fmtDate(ts)+'</span>';
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var toastTimer=null;
  function showToast(msg){
    var el = document.querySelector('.toast');
    if(el) el.remove();
    el = document.createElement('div');
    el.className='toast';
    el.textContent=msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.remove(); }, 2600);
  }

  // Localized in-page dialogs. These replace browser confirm/prompt dialogs so
  // the browser's "roshan7860.github.io says" header never appears.
  function localizeDialogText(msg){
    var lang=state.language||'ps';
    var raw=String(msg==null?'':msg);
    if(lang==='ps') return raw;
    var exact=lookupUITranslation(raw,lang);
    if(exact) return exact;
    var keys=[];
    Object.keys(MISSING_UI_TRANSLATIONS||{}).forEach(function(k){if(k.length>=3)keys.push(k);});
    Object.keys(STATIC_TRANSLATIONS||{}).forEach(function(k){if(k.length>=3)keys.push(k);});
    keys.sort(function(a,b){return b.length-a.length;});
    var out=raw;
    keys.forEach(function(k){
      if(out.indexOf(k)!==-1){var tr=lookupUITranslation(k,lang);if(tr)out=out.split(k).join(tr);}
    });
    return out;
  }

  // ---------------- notifications (Web Notification API + FCM push) ----------------
  function requestNotificationPermission(){
    if(!('Notification' in window)) return;
    if(Notification.permission==='default'){
      Notification.requestPermission().then(function(perm){
        if(perm==='granted') setupPushForCurrentUser();
      }).catch(function(){});
    }else if(Notification.permission==='granted'){
      setupPushForCurrentUser();
    }
  }

  // Registers this device for real push notifications (FCM) -- these keep
  // arriving even when the app is closed/backgrounded, unlike the in-page
  // Firestore listeners below which only fire while the app is open and
  // active. The resulting token is stored on the logged-in user's record so
  // a server-side Cloud Function can look it up and send that user a push
  // whenever something relevant happens (see functions/index.js).
  function syncNotificationTokenForUser(username, token){
    if(!username || !token) return Promise.resolve();
    var ref = db.collection('appdata').doc('notificationTokens');
    return ref.get().then(function(snap){
      var list = snap.exists && Array.isArray(snap.data().list) ? snap.data().list.slice() : [];
      list = list.filter(function(x){ return x && x.token!==token && x.username!==username; });
      list.push({username:username, token:token, updatedAt:Date.now()});
      return ref.set({list:list},{merge:true});
    });
  }

  function removeNotificationTokensForUser(username){
    if(!username) return Promise.resolve();
    var ref = db.collection('appdata').doc('notificationTokens');
    return ref.get().then(function(snap){
      if(!snap.exists) return;
      var list = Array.isArray(snap.data().list) ? snap.data().list : [];
      var next = list.filter(function(x){ return !x || x.username!==username; });
      return ref.set({list:next},{merge:true});
    }).catch(function(){});
  }

  function setupPushForCurrentUser(){
    if(!messaging) return; // unsupported browser, or VAPID_KEY not filled in yet
    if(!('serviceWorker' in navigator)) return;
    if(!state.currentUser) return;
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    navigator.serviceWorker.ready.then(function(reg){
      return messaging.getToken({vapidKey:VAPID_KEY, serviceWorkerRegistration:reg});
    }).then(function(token){
      if(!token || !state.currentUser) return;
      var loggedUsername = state.currentUser.username;
      var loggedToken = state.mySessionToken;
      var u = state.users.find(function(x){ return x.username===loggedUsername; });
      if(!state.currentUser || state.currentUser.username!==loggedUsername || state.mySessionToken!==loggedToken) return;
      if(!u) return;
      if(!u.fcmTokens) u.fcmTokens = [];
      if(u.fcmTokens.indexOf(token)===-1){
        u.fcmTokens.push(token);
        persistUsers();
      }
      // Keep the server-side push registry in sync with the actual logged-in user.
      // This is what prevents a previously logged-out browser from receiving
      // background notifications through the Firebase Cloud Function.
      syncNotificationTokenForUser(loggedUsername, token).catch(function(){});
    }).catch(function(err){ console.warn('FCM token setup failed', err); });
  }

  function fireNotification(title, body){
    if(!state.currentUser) return;
    if(!('Notification' in window)) return;
    if(Notification.permission!=='granted') return;
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.ready){
        navigator.serviceWorker.ready.then(function(reg){
          if(reg && reg.showNotification){
            reg.showNotification(title, {body:body, icon:'icon-192.png', badge:'icon-192.png', vibrate:[200,100,200]});
          }else{
            new Notification(title, {body:body, icon:'icon-192.png'});
          }
        }).catch(function(){
          new Notification(title, {body:body, icon:'icon-192.png'});
        });
      }else{
        new Notification(title, {body:body, icon:'icon-192.png'});
      }
    }catch(e){}
  }

  // ---------------- real-time sync ----------------
  function attachListeners(){
    if(state.unsubs) return;
    state.unsubs = [];
    state.unsubs.push(db.collection('appdata').doc('users').onSnapshot(function(snap){
      if(snap.exists && snap.data().list){
        state.users = snap.data().list;
        state.loadError = false;
        if(state.currentUser && (state.currentUser.role==='admin' || state.currentUser.role==='manager' || state.currentUser.role==='nto')){
          var liveUser = state.users.find(function(u){return u.username===state.currentUser.username;});
          if(liveUser && liveUser.forceLogoutAt && liveUser.forceLogoutAt > (state.myForceLogoutBaseline||0)){
            // An admin force-logged this user out. Sign out and force a full
            // page reload -- same treatment as a new deployed version -- so
            // this user is guaranteed to come back with the latest code.
            state.currentUser=null;
            state.section=null;
            state.modal=null;
            state.userMenuOpen=false;
            state.mySessionToken=null;
            clearSavedSession();
            showToast('اډمین تاسو لاگ-اوټ کړئ. نوي بدلونونه به اوس پلي شي.');
            setTimeout(function(){ window.location.reload(); }, 700);
            return;
          }
          if(!liveUser || liveUser.status==='disabled' || ((liveUser.role==='nto') && (liveUser.status==='pending_admin'||liveUser.status==='rejected_admin')) || (liveUser.sessionToken && state.mySessionToken && liveUser.sessionToken!==state.mySessionToken)){
            state.currentUser=null;
            state.section=null;
            state.modal=null;
            state.userMenuOpen=false;
            state.mySessionToken=null;
            clearSavedSession();
            state.error = 'ستاسو حساب په بل ځای کې داخل شوی دی؛ دا پخوانی Login نور فعال نه دی.';
          }
        }
        render();
      }
    }));
    state.unsubs.push(db.collection('appdata').doc('bundles').onSnapshot(function(snap){
      if(snap.exists && snap.data().list){
        var newList = snap.data().list;
        // Do not ring notifications from Firestore's local optimistic snapshot.
        // The bell is triggered only after the write is acknowledged by the server,
        // preventing a notification for a bundle that later fails to persist.
        if(!snap.metadata || !snap.metadata.hasPendingWrites){
          checkForNewNtoActivity(newList);
          checkForStatusChangesForNto(newList);
        }
        state.bundles = newList;
        render();
      }
    }));
    state.unsubs.push(db.collection('appdata').doc('complaints').onSnapshot(function(snap){
      if(snap.exists && snap.data().list){ state.complaints = snap.data().list; render(); }
    }));
    state.unsubs.push(db.collection('appdata').doc('rolls').onSnapshot(function(snap){
      if(snap.exists && snap.data().list){ state.rolls = snap.data().list; render(); }
    }));
    state.unsubs.push(db.collection('appdata').doc('salesTotals').onSnapshot(function(snap){
      if(snap.exists){
        state.managerSales = snap.data().managerSales || {};
        state.ntoSales = snap.data().ntoSales || {};
        state.salesResetAt = snap.data().salesResetAt || state.salesResetAt || {manager:{},nto:{}};
        state.customerSalesResetAt = snap.data().customerSalesResetAt || state.customerSalesResetAt || {};
        render();
      }
    }));
    state.unsubs.push(db.collection('appdata').doc('settings').onSnapshot(function(snap){
      var d = snap.exists ? (snap.data()||{}) : {};
      var rate = Number(d.list && d.list.commissionRate);
      if(!isFinite(rate) || rate < 0) rate = 3;
      if(state.commissionRate !== rate){
        state.commissionRate = rate;
        render();
      }
    }));
    state.unsubs.push(db.collection('appdata').doc('system').onSnapshot(function(snap){
      var d = snap.exists ? (snap.data()||{}) : {};
      var gv = Number(d.globalLogoutVersion||0);
      if(gv && gv > Number(state.globalLogoutVersion||0)){
        state.globalLogoutVersion = gv;
        if(state.currentUser){
          var meUser = state.users.find(function(u){return u.username===state.currentUser.username;});
          if(meUser){ meUser.onlineStatus = 'offline'; persistUsers().catch(function(){}); }
          state.currentUser = null;
          state.section = null;
          state.modal = null;
          state.userMenuOpen = false;
          state.mySessionToken = null;
          clearSavedSession();
          state.error = 'نوى نسخه راغلي او په همدې خاطر تاسو له سيستم څخه په اتومات توګه ايستل شوي ياست مهرباني وکړئ بيا داخل شئ. مننه!';
          render();
        }
      }
    }));
  }

  // ---------------- notify manager/admin of new NTO activity (submit / resubmit) ----------------
  function checkForNewNtoActivity(newBundles){
    var prevMap = {};
    state.bundles.forEach(function(b){ prevMap[b.id] = b.status; });

    if(state.knownBundleIds===null){
      state.knownBundleIds = true;
      return;
    }

    var newOnes = [];
    newBundles.forEach(function(b){
      if(b.status==='pending' || b.status==='resubmit'){
        if(prevMap[b.id]===undefined || prevMap[b.id]!==b.status){
          newOnes.push(b);
          delete state.notifiedBundleIds[b.id]; // fresh submit/resubmit -- allow re-notifying
        }
      }
    });

    if(newOnes.length && state.currentUser && (state.currentUser.role==='manager' || state.currentUser.role==='admin')){
      // For a manager, only ring immediately for bundles that are actually
      // theirs to claim right now (their own customer, or a customer with
      // no owning manager). Bundles reserved for a different manager stay
      // silent for this manager until the assignment window elapses --
      // see checkForManagerEscalations(), which fires later.
      var mine = state.currentUser.role==='admin' ? newOnes : newOnes.filter(function(b){
        return isBundleClaimableByManager(b, state.currentUser.username);
      });
      if(mine.length){
        if(state.currentUser.role==='manager') playNotificationSound();
        var b0 = mine[0];
        state.notifiedBundleIds[b0.id] = true;
        fireNotification('نوی بنډل راغی', b0.ntoUsername+' یو بنډل ('+b0.field2+') ولیږه.');
        showToast('نوی بنډل راغی — '+b0.ntoUsername);
      }
    }
    scheduleAssignWindowRefresh();
  }

  // ---------------- notify a manager once an assignment window elapses and a
  // bundle that wasn't theirs opens up to all managers ----------------
  function checkForManagerEscalations(){
    if(!state.currentUser || state.currentUser.role!=='manager') return;
    var opened = state.bundles.filter(function(b){
      if(b.status==='approved' || b.status==='rejected' || b.status==='deactivated') return false;
      if(state.notifiedBundleIds[b.id]) return false;
      return isBundleClaimableByManager(b, state.currentUser.username);
    });
    if(opened.length){
      playNotificationSound();
      opened.forEach(function(b){ state.notifiedBundleIds[b.id] = true; });
      var b0 = opened[0];
      fireNotification('یو بنډل اوس تاسو ته هم خلاص دی', b0.ntoUsername+' — ('+b0.field2+')');
      showToast('یو بنډل اوس ستاسو لپاره هم خلاص شو — '+b0.ntoUsername);
    }
  }

  // ---------------- notify NTO when their bundle gets approved/rejected ----------------
  function checkForStatusChangesForNto(newBundles){
    if(!state.currentUser || state.currentUser.role!=='nto') return;
    var prevMap = {};
    state.bundles.forEach(function(b){ prevMap[b.id] = b.status; });

    newBundles.forEach(function(b){
      if(b.ntoUsername!==state.currentUser.username) return;
      var was = prevMap[b.id];
      if(was===undefined) return; // don't alert for the initial load / own fresh submit
      if(was!==b.status && (b.status==='approved' || b.status==='rejected')){
        fireNotification(
          b.status==='approved' ? 'ستاسو بنډل فعاله شو' : 'ستاسو بنډل رد شو',
          b.field2+' — '+(b.comment ? b.comment : '')
        );
      }
    });
  }

  function playNotificationSound(){
    if(!state.currentUser) return;
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ctx = new Ctx();
      var now = ctx.currentTime;
      // A soft three-note ascending chime (bell-like), closer to a phone alert tone
      // than a flat single beep.
      var notes = [
        {freq:988,  start:0.00, dur:0.16},
        {freq:1319, start:0.13, dur:0.16},
        {freq:1568, start:0.26, dur:0.34}
      ];
      notes.forEach(function(n){
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = n.freq;
        g.gain.setValueAtTime(0.0001, now+n.start);
        g.gain.exponentialRampToValueAtTime(0.22, now+n.start+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now+n.start+n.dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(now+n.start);
        o.stop(now+n.start+n.dur+0.02);
      });
      setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 900);
    }catch(e){}
    if(navigator.vibrate){ try{ navigator.vibrate([150,60,150]); }catch(e){} }
  }

  // ---------------- PWA: register service worker ----------------
  // Auto-update: whenever a newer sw.js/cache gets installed in the
  // background, force a one-time reload so people actually get the new
  // code instead of being stuck on a cached copy of index.html/app logic
  // until they manually clear their browser cache.
  if('serviceWorker' in navigator){
    var swReloaded = false;
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        if(!reg) return;
        reg.update().catch(function(){});
        if(reg.waiting && navigator.serviceWorker.controller){
          reg.waiting.postMessage && reg.waiting.postMessage('SKIP_WAITING');
        }
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if(!nw) return;
          nw.addEventListener('statechange', function(){
            if(nw.state==='installed' && navigator.serviceWorker.controller && !swReloaded){
              swReloaded = true;
              window.location.reload();
            }
          });
        });
      }).catch(function(){ /* ignore */ });
      if(navigator.serviceWorker.controller){
        navigator.serviceWorker.addEventListener('controllerchange', function(){
          if(!swReloaded){ swReloaded = true; window.location.reload(); }
        });
      }
    });
  }

  // ---------------- AUTO LOGOUT ON NEW DEPLOYMENT ----------------
  // The current HTML contains a build version. Every 30 seconds, compare it
  // with a fresh copy of the page. If a newer version is deployed, log out,
  // clear the old session and reload so the user gets the new code.
  var versionCheckTimer = null;
  function startVersionCheck(){
    if(versionCheckTimer) clearInterval(versionCheckTimer);
    versionCheckTimer = setInterval(function(){
      if(!state.currentUser) return;
      var url = window.location.href.split('#')[0];
      url += (url.indexOf('?')>=0?'&':'?')+'__appv='+Date.now();
      fetch(url, {cache:'no-store', credentials:'same-origin'}).then(function(r){ return r.text(); }).then(function(html){
        var m = html.match(/<meta[^>]+name=["']app-build-version["'][^>]+content=["']([^"']+)["'][^>]*>/i) ||
                html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+name=["']app-build-version["'][^>]*>/i);
        if(m && m[1] && m[1]!==APP_BUILD_VERSION){
          clearSavedSession();
          state.currentUser = null;
          state.mySessionToken = null;
          showToast('نوی بدلون راغلی، مهرباني وکړئ بیا داخل شئ.');
          setTimeout(function(){ window.location.reload(); }, 700);
        }
      }).catch(function(){});
    }, 30000);
  }

  // ---------------- close the top-bar user dropdown when clicking elsewhere ----------------
  document.addEventListener('click', function(e){
    if(!state.userMenuOpen) return;
    var wrap = document.getElementById('mt-user-wrap');
    if(wrap && wrap.contains(e.target)) return;
    state.userMenuOpen = false;
    render();
  });

  // ---------------- init ----------------
  loadAll().then(function(){
    // Repair the historical report data before showing the dashboard. If the
    // migration cannot run because of a temporary connection problem, keep the
    // app usable and retry on the next page load.
    return migrateApprovedBundleSales().catch(function(err){
      console.warn('sales migration failed', err);
    });
  }).then(function(){
    restoreSession();
    state.loading = false;
    attachListeners();
    scheduleAssignWindowRefresh();
    render();
    startVersionCheck();
    if(state.currentUser) requestNotificationPermission();
  });

})();
</script>

  function lookup(s){
    var key=String(s||'').replace(/\u00a0/g,' ').trim();
    if(!key) return null;
    if(EN_UI_EXTRA[key]) return EN_UI_EXTRA[key];
    if(typeof STATIC_TRANSLATIONS!=='undefined' && STATIC_TRANSLATIONS[key] && STATIC_TRANSLATIONS[key].en) return STATIC_TRANSLATIONS[key].en;
    return null;
  }

  function translateEnglishUI(root){
    if(!root) return;
    var walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false), nodes=[];
    var n;
    while((n=walker.nextNode())) nodes.push(n);
    nodes.forEach(function(node){
      var parent=node.parentElement;
      if(!parent) return;
      var value=node.nodeValue;
      var trimmed=value.replace(/\u00a0/g,' ').trim();
      var tr=lookup(trimmed);
      if(tr && trimmed===value.trim()){
        node.nodeValue=value.replace(trimmed,tr);
      }
    });

    var els=root.querySelectorAll ? root.querySelectorAll('*') : [];
    Array.prototype.forEach.call(els,function(el){
      ['placeholder','title','aria-label','data-label'].forEach(function(attr){
        var val=el.getAttribute(attr);
        var tr=lookup(val);
        if(tr) el.setAttribute(attr,tr);
      });
    });
  }

  function run(){
    if((typeof state==='undefined') || (state.language||'en')!=='en') return;
    translateEnglishUI(document.getElementById('app'));
  }

  function start(){
    run();
    var app=document.getElementById('app');
    if(!app) return;
    var observer=new MutationObserver(function(){ run(); });
    observer.observe(app,{childList:true,subtree:true,characterData:true});
    window.__englishUiObserver=observer;
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
})();
</script>
</body>
</html>
